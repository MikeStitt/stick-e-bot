<svg xmlns="http://www.w3.org/2000/svg" viewBox="-90 -36 180 58" width="1152" height="371" font-family="ui-monospace, Menlo, monospace"><style>
  .part  { fill:#dfe7ec; stroke:#1d262e; stroke-width:0.9; stroke-linejoin:round; }
