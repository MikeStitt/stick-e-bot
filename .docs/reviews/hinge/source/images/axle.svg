  .note  { fill:#6b7a88; font-size:3.6px; }
  .warn  { fill:#b8156e; font-size:3.6px; font-weight:700; }
  .ctr   { stroke:#7f8f9c; stroke-width:0.3; stroke-dasharray:6 2 1 2; }
  .stn   { stroke:#0b6e86; stroke-width:0.25; stroke-dasharray:3 2; }
  .gnd   { stroke:#0b6e86; stroke-width:0.8; }
  .tooth { stroke:#1d262e; stroke-width:0.5; fill:none; }
  .det * { vector-effect: non-scaling-stroke; }
  .fig * { vector-effect: non-scaling-stroke; }
  .fig .call { font-size:6.83655px; }
  .fig .note { font-size:7.2387px; }
  .fig .name { font-size:10.0537px; }
  .fig .dimt { font-size:8.44515px; }
  .fig .lbl { font-size:9.24945px; }
  .fig .warn { font-size:7.2387px; }

  .rod   { fill:#f3e6d8; stroke:#1d262e; stroke-width:0.9; stroke-linejoin:round; }
  .bad   { fill:#b8156e; font-size:3.6px; font-weight:700; }
  .good  { fill:#0b6e86; font-size:3.6px; font-weight:700; }
  .head  { fill:#12303c; font-size:5.4px; font-weight:700; letter-spacing:0.04em; }
  .sub   { fill:#43525e; font-size:3.8px; }
  .arrow { stroke:#b8156e; stroke-width:0.7; fill:none; }
  .conn  { stroke:#0b6e86; stroke-width:0.8; fill:none; }
  .connd { fill:#0b6e86; font-size:3.6px; font-weight:700; }
