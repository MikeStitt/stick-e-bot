<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 780" width="1400" height="780"><title>the rim and its wear</title><style>
 .fork{fill:#dbe6ee;stroke:#1d262e;stroke-width:1.1;stroke-linejoin:round}
 .blade{fill:#f9e3ed;stroke:#1d262e;stroke-width:1.1;stroke-linejoin:round}
 .land{fill:#a9c8de;stroke:#1d262e;stroke-width:1.1;stroke-linejoin:round}
 .cham{fill:#c5d9e8;stroke:#1d262e;stroke-width:.9;stroke-linejoin:round}
 .hole{fill:#ffffff;stroke:#1d262e;stroke-width:.9}
 .worn{fill:#b8156e;stroke:none;opacity:.45}
 .ghost{fill:none;stroke:#8fa3b0;stroke-width:1;stroke-dasharray:5 3}
 .dim{stroke:#b8156e;stroke-width:1;fill:none}
 .lead{stroke:#5b6b78;stroke-width:.8;fill:none}
 .hit{fill:#b8156e;stroke:#fff;stroke-width:1}
 text{font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;fill:#1d262e}
 .h{font-size:19px;font-weight:600} .s{font-size:14px}
 .n{font-size:12px;fill:#b8156e} .g{font-size:12px;fill:#5b6b78}
</style><rect width="1400" height="780" fill="#ffffff"/><text x="700.0" y="44.0" class="h" text-anchor="middle">The cone lands on a corner, and the corner does not stay sharp</text><text x="700.0" y="70.0" class="g" text-anchor="middle">The same cone and valley, drawn 150 times full size, sectioned the way it slides. The whole load runs through the rim&#8217;s edge.</text><polygon class="blade" points="6.5,360.0 104.0,360.0 194.0,270.0 254.0,270.0 344.0,360.0 441.5,360.0 441.5,423.0 6.5,423.0"/><path class="fork" d="M 134.0,192.0 V 330.0  H 6.5 V 192.0 Z"/><circle class="hit" cx="134.0" cy="330.0" r="4.5"/><path class="fork" d="M 314.0,192.0 V 330.0  H 441.5 V 192.0 Z"/><circle class="hit" cx="314.0" cy="330.0" r="4.5"/><path class="ghost" d="M 6.5,270.0 H 441.5"/><path class="lead" d="M 14.0,330.0 H 39.0"/><path class="lead" d="M 14.0,360.0 H 39.0"/><path class="dim" d="M 32.0,310.0 V 380.0"/><path class="dim" d="M 32.0,330.0 l -3.5,-6 m 7,0 l -3.5,6"/><path class="dim" d="M 32.0,360.0 l -3.5,6 m 7,0 l -3.5,-6"/><text x="41.0" y="349.0" class="n" text-anchor="start">0.200</text><text x="224.0" y="468.0" class="s" text-anchor="middle">seated, new</text><text x="224.0" y="490.0" class="g" text-anchor="middle">the faces stand this far apart</text><text x="224.0" y="512.0" class="n" text-anchor="middle">0.400 of climb left</text><polygon class="blade" points="470.5,360.0 628.0,360.0 718.0,270.0 778.0,270.0 868.0,360.0 905.5,360.0 905.5,423.0 470.5,423.0"/><path class="fork" d="M 598.0,192.0 V 270.0  H 470.5 V 192.0 Z"/><path class="fork" d="M 778.0,192.0 V 270.0  H 905.5 V 192.0 Z"/><circle class="hit" cx="778.0" cy="270.0" r="4.5"/><path class="ghost" d="M 470.5,270.0 H 905.5"/><path class="lead" d="M 478.0,270.0 H 503.0"/><path class="lead" d="M 478.0,360.0 H 503.0"/><path class="dim" d="M 496.0,270.0 V 360.0"/><path class="dim" d="M 496.0,270.0 l -3.5,6 m 7,0 l -3.5,-6"/><path class="dim" d="M 496.0,360.0 l -3.5,-6 m 7,0 l -3.5,6"/><text x="505.0" y="319.0" class="n" text-anchor="start">0.600</text><text x="688.0" y="468.0" class="s" text-anchor="middle">at the top of its climb</text><text x="688.0" y="490.0" class="g" text-anchor="middle">the faces stand this far apart</text><text x="688.0" y="512.0" class="n" text-anchor="middle">riding the land</text><polygon class="blade" points="934.5,360.0 1032.0,360.0 1122.0,270.0 1182.0,270.0 1272.0,360.0 1369.5,360.0 1369.5,423.0 934.5,423.0"/><path class="fork" d="M 1062.0,192.0 V 293.8 A 15.0,15.0 0 0 0 1047.0,308.8 H 934.5 V 192.0 Z"/><path class="worn" d="M 1062.0,293.8 V 308.8 H 1047.0 A 15.0,15.0 0 0 1 1062.0,293.8 Z"/><circle class="hit" cx="1057.6" cy="313.2" r="4.5"/><path class="fork" d="M 1242.0,192.0 V 293.8 A 15.0,15.0 0 0 1 1257.0,308.8 H 1369.5 V 192.0 Z"/><path class="worn" d="M 1242.0,293.8 V 308.8 H 1257.0 A 15.0,15.0 0 0 0 1242.0,293.8 Z"/><circle class="hit" cx="1246.4" cy="313.2" r="4.5"/><path class="ghost" d="M 934.5,270.0 H 1369.5"/><path class="lead" d="M 942.0,308.8 H 967.0"/><path class="lead" d="M 942.0,360.0 H 967.0"/><path class="dim" d="M 960.0,308.8 V 360.0"/><path class="dim" d="M 960.0,308.8 l -3.5,6 m 7,0 l -3.5,-6"/><path class="dim" d="M 960.0,360.0 l -3.5,-6 m 7,0 l -3.5,6"/><text x="969.0" y="338.4" class="n" text-anchor="start">0.341</text><text x="1152.0" y="468.0" class="s" text-anchor="middle">seated again, after the rim has worn 0.10</text><text x="1152.0" y="490.0" class="g" text-anchor="middle">the faces stand this far apart</text><text x="1152.0" y="512.0" class="n" text-anchor="middle">0.259 of climb left</text><text x="70.0" y="572.0" class="s" text-anchor="start">A round on the rim, whether it is designed in or worn in, holds the cone up off its seat by 1.414 times the radius, so the joint loses that much</text><text x="70.0" y="594.0" class="s" text-anchor="start">of its climb before it ever starts to turn. Hold goes with climb:</text><text x="110.0" y="634.0" class="s" text-anchor="start">rim round 0.00 &#8594; climb 0.400</text><text x="110.0" y="656.0" class="n" text-anchor="start">holds 100% of new</text><text x="420.0" y="634.0" class="s" text-anchor="start">rim round 0.05 &#8594; climb 0.329</text><text x="420.0" y="656.0" class="n" text-anchor="start">holds 82% of new</text><text x="730.0" y="634.0" class="s" text-anchor="start">rim round 0.10 &#8594; climb 0.259</text><text x="730.0" y="656.0" class="n" text-anchor="start">holds 65% of new</text><text x="1040.0" y="634.0" class="s" text-anchor="start">rim round 0.15 &#8594; climb 0.188</text><text x="1040.0" y="656.0" class="n" text-anchor="start">holds 47% of new</text><text x="70.0" y="704.0" class="s" text-anchor="start">This is why the 0.1 round that used to sit on the valley&#8217;s rim was worth taking off, and why the joint will feel looser after a few dozen presses</text><text x="70.0" y="726.0" class="s" text-anchor="start">than it does on the first one. Size the tooth for the worn number, not the new one.</text></svg>