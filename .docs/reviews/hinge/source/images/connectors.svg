="M -12,-27.85 H -21"/><path class="dim" d="M -12,-12 H -21"/><text class="dimt" x="-24.4" y="-19.925" text-anchor="middle" transform="rotate(-90 -24.4 -19.925)">15.85 mm</text><text class="head" x="26" y="-38.85" text-anchor="middle">the two robot connectors</text><text class="sub" x="26" y="42.85" text-anchor="middle">one is buried and points inward, the other is flush</text><text class="sub" x="26" y="47.85" text-anchor="middle">and points out, so the fork needs Transform's flip</text><text class="sub" x="26" y="52.85" text-anchor="middle">in its limb where the blade does not</text></svg>