translate(196,0)"><g class="fig" transform="scale(0.497327)"><rect class="part" x="-24" y="75.6124" width="48" height="96"/><rect class="part" x="-3" y="63.6124" width="6" height="12"/><circle class="part" cx="0" cy="65.6124" r="6"/><rect class="part" x="-7.8" y="55.6124" width="15.6" height="12.2205"/><rect class="part" x="-30" y="-16.3876" width="60" height="72"/><rect class="part" x="-12" y="181.612" width="24" height="48"/><rect class="part" x="-12" y="229.612" width="24" height="48"/><path class="part" d="M -40,301.612 h 96 a 10 10 0 0 0 -2 -16 q -28 -8 -92 -8 a 10 10 0 0 0 -2 24 z"/><rect class="part" x="-4.1764" y="171.612" width="24" height="43.422"/><rect class="hid" x="-4.1764" y="104.377" width="24" height="67.2355"/><line class="ctr" x1="0" y1="-22.3876" x2="0" y2="307.612"/></g><line class="gnd" x1="-26" y1="150" x2="34" y2="150"/><g class="dim"><path d="M -12 85.3475 V 90.3475 M 12 85.3475 V 90.3475"/><path d="M -12 88.8475 H 12"/><path d="M -12 88.8475 l 4 -1.4 v 2.8 z" fill="#b8156e"/><path d="M 12 88.8475 l -4 -1.4 v 2.8 z" fill="#b8156e"/></g><text class="dimt" x="-14" y="87.8475" text-anchor="end">48 mm</text><path class="lead" d="M3.89089,98.9424 L26,102.942"/><text class="call" x="27" y="103.942" text-anchor="start">both arms, edge-on</text><text class="note" x="4" y="168" text-anchor="middle">The arms lie in one plane 7.82 mm forward of center,</text><text class="note" x="4" y="174" text-anchor="middle">so this view sees them edge-on and both at once. Dashed</text><text class="note" x="4" y="180" text-anchor="middle">where the torso is in front of them.</text></g><text class="lbl" x="0" y="-10" text-anchor="middle">FRONT</text><text class="lbl" x="196" y="-10" text-anchor="middle">SIDE</text><text class="lbl" x="-86" y="-52" text-anchor="start">SHEET 1 &#8212; ASSEMBLED</text><text class="note" x="-86" y="-44" text-anchor="start">The parts from sheet 2, assembled. Joint centers sit on their station lines, and every station is derived &#8212; nothing is fitted to a round height.</text><text class="note" x="-86" y="-38" text-anchor="start">Shoulder stud 53&#176; down and 30&#176; forward, 26 mm long: a &#216;16 boss coaxial with the last 10 mm of &#216;6 stalk, cut flush at the torso's top face.</text><text class="note" x="-86" y="-32" text-anchor="start">That puts the ball 13.55 mm clear of the side, so a &#216;24 arm swings anywhere the socket allows &#8212; -2.31&#176; to 68.56&#176; from vertical.</text><text class="note" x="-86" y="-26" text-anchor="start">The arm is drawn at 33.13&#176;, hanging 17.51&#176; off the stud. All of that is fore-and-aft, so it stays in one plane and this view reads true length.</text><text class="note" x="-86" y="-20" text-anchor="start">Elbows bent 45&#176; for the picture; the assembly is saved at rest. The gripper's bore runs left-right, so it is two hidden lines here and a circle on the parts sheet.</text><text class="note" x="-86" y="198" text-anchor="start">Session 1 builds the neck as a plain &#216;24 mm post. It becomes the ball joint shown here once joints are taught.</text></svg>