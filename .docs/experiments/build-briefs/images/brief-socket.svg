</style><g transform="scale(22,-22)" class="det"><rect class="part" x="-12" y="-20" width="24" height="10"/><path class="part" d="M -7.8,-10 V 2.22054 H -5.66 A 6.08,6.08 0 1 1 5.66,2.22054 H 7.8 V -10 Z"/><path class="hid" d="M -0.8,2.22054 V -10 M 0.8,2.22054 V -10"/><path class="ctr" d="M 0,-21.5 V 14.5"/><rect class="mate" x="-3" y="8" width="6" height="5"/><circle class="mate" cx="0" cy="8" r="6"/></g><text class="lbl" x="0" y="-330" text-anchor="middle">THE SOCKET, IN SECTION, IN A LIMB</text><text class="note" x="0" y="-318" text-anchor="middle">The socket is the ball, grown by the fit. The stud is drawn lifted clear of the mouth it has to enter.</text><path class="dim" d="M -132,-176 H 132"/><path d="M -132,-176 l 4,-1.4 v 2.8 z" fill="#b8156e"/><path d="M 132,-176 l -4,-1.4 v 2.8 z" fill="#b8156e"/><text class="dimt" x="0" y="-178.2" text-anchor="middle">ball &#216;12 mm</text><path class="dim" d="M -124.52,-64.8519 H 124.52"/><path d="M -124.52,-64.8519 l 4,-1.4 v 2.8 z" fill="#b8156e"/><path d="M 124.52,-64.8519 l -4,-1.4 v 2.8 z" fill="#b8156e"/><text class="dimt" x="0" y="-67.0519" text-anchor="middle">mouth &#216;11.320 mm</text><path class="dim" d="M -124.52,-48.8519 L -124.52,-64.8519" stroke-dasharray="2 1.5"/><path class="dim" d="M 124.52,-48.8519 L 124.52,-64.8519" stroke-dasharray="2 1.5"/><path class="dim" d="M -133.76,24.2 H 133.76"/><path d="M -133.76,24.2 l 4,-1.4 v 2.8 z" fill="#b8156e"/><path d="M 133.76,24.2 l -4,-1.4 v 2.8 z" fill="#b8156e"/><text class="dimt" x="0" y="22" text-anchor="middle">cavity &#216;12.16 mm = ball + 2 &#215; fit</text><path class="dim" d="M -171.6,-8.8 H -133.76"/><path d="M -171.6,-8.8 l 4,-1.4 v 2.8 z" fill="#b8156e"/><path d="M -133.76,-8.8 l -4,-1.4 v 2.8 z" fill="#b8156e"/><text class="dimt" x="-152.68" y="-11" text-anchor="middle">wall 1.8 mm</text><path class="dim" d="M -171.6,242 H 171.6"/><path d="M -171.6,242 l 4,-1.4 v 2.8 z" fill="#b8156e"/><path d="M 171.6,242 l -4,-1.4 v 2.8 z" fill="#b8156e"/><text class="dimt" x="0" y="239.8" text-anchor="middle">collar &#216;15.6 mm</text><path class="dim" d="M -171.6,220 L -171.6,242" stroke-dasharray="2 1.5"/><path class="dim" d="M 171.6,220 L 171.6,242" stroke-dasharray="2 1.5"/><path class="dim" d="M -264,464 H 264"/><path d="M -264,464 l 4,-1.4 v 2.8 z" fill="#b8156e"/><path d="M 264,464 l -4,-1.4 v 2.8 z" fill="#b8156e"/><text class="dimt" x="0" y="461.8" text-anchor="middle">limb &#216;24 mm</text><path class="dim" d="M 290,-48.8519 V 220"/><path d="M 290,-48.8519 l -1.4,4 h 2.8 z" fill="#b8156e"/><path d="M 290,220 l -1.4,-4 h 2.8 z" fill="#b8156e"/><text class="dimt" x="292.6" y="85.5741" text-anchor="middle" transform="rotate(-90 292.6 85.5741)">collar 12.2205 mm proud</text><path class="dim" d="M 398,-48.8519 V 0"/><path d="M 398,-48.8519 l -1.4,4 h 2.8 z" fill="#b8156e"/><path d="M 398,0 l -1.4,-4 h 2.8 z" fill="#b8156e"/><text class="dimt" x="403" y="-22.9259" text-anchor="start">grip 2.22054 mm</text><path class="dim" d="M 171.6,-48.8519 L 404,-48.8519" stroke-dasharray="2 1.5"/><path class="dim" d="M 171.6,220 L 296,220" stroke-dasharray="2 1.5"/><path class="dim" d="M 133.76,0 L 404,0" stroke-dasharray="2 1.5"/><text class="note" x="0" y="488" text-anchor="middle">Retention is 0.680 mm &#8212; the ball less the mouth. That is all that holds it in.</text><text class="note" x="0" y="500" text-anchor="middle">Four slits 1.6 mm wide run 6.2205 mm down from the mouth so the mouth can open. One is drawn hidden.</text><text class="note" x="0" y="512" text-anchor="middle">On the head this same socket sits in a flat face. On a limb it sits in the cylinder, as here &#8212; never on a square pad.</text></svg>