<svg xmlns="http://www.w3.org/2000/svg" viewBox="-330 -348 660 890" width="1320" height="1780" font-family="ui-monospace, Menlo, monospace"><style>
  .part  { fill:#dfe7ec; stroke:#1d262e; stroke-width:0.9; stroke-linejoin:round; }
