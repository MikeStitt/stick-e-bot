<svg xmlns="http://www.w3.org/2000/svg" viewBox="-470 -382 940 872" width="2068" height="1918" font-family="ui-monospace, Menlo, monospace"><style>
  .part  { fill:#dfe7ec; stroke:#1d262e; stroke-width:0.9; stroke-linejoin:round; }
  .ghost { fill:#eef2f5; stroke:#8ea0ad; stroke-width:0.7; stroke-linejoin:round; }
  .void  { fill:#ffffff; stroke:#1d262e; stroke-width:0.9; stroke-linejoin:round; }
  .mate  { fill:#f6f9fa; stroke:#1d262e; stroke-width:0.9; stroke-linejoin:round; }
  .hid   { fill:none; stroke:#5b6b78; stroke-width:0.4; stroke-dasharray:2 1.4; }
  .dim   { stroke:#b8156e; stroke-width:0.35; fill:none; }
  .dimt  { fill:#b8156e; font-size:4.2px; font-weight:700; }
  .name  { fill:#12303c; font-size:5px; font-weight:700; letter-spacing:0.06em; }
  .call  { fill:#43525e; font-size:3.4px; }
  .lead  { stroke:#8ea0ad; stroke-width:0.3; fill:none; }
  .lbl   { fill:#43525e; font-size:4.6px; font-weight:700; letter-spacing:0.12em; }
  .note  { fill:#6b7a88; font-size:3.6px; }
  .warn  { fill:#b8156e; font-size:3.6px; font-weight:700; }
  .ctr   { stroke:#7f8f9c; stroke-width:0.3; stroke-dasharray:6 2 1 2; }
  .stn   { stroke:#0b6e86; stroke-width:0.25; stroke-dasharray:3 2; }
  .gnd   { stroke:#0b6e86; stroke-width:0.8; }
  .tooth { stroke:#1d262e; stroke-width:0.5; fill:none; }
  .det * { vector-effect: non-scaling-stroke; }
  .fig * { vector-effect: non-scaling-stroke; }
  .fig .call { font-size:6.83655px; }
  .fig .note { font-size:7.2387px; }
  .fig .name { font-size:10.0537px; }
  .fig .dimt { font-size:8.44515px; }
  .fig .lbl { font-size:9.24945px; }
  .fig .warn { font-size:7.2387px; }
</style><g transform="scale(26,-26)" class="det"><clipPath id="limb"><path d="M 10.4494,-5.9 V 5.9 A 12,12 0 0 1 -10.4494,5.9 V -5.9 A 12,12 0 0 1 10.4494,-5.9 Z"/></clipPath><path class="ghost" d="M 10.4494,-5.9 V 5.9 A 12,12 0 0 1 -10.4494,5.9 V -5.9 A 12,12 0 0 1 10.4494,-5.9 Z"/><g clip-path="url(#limb)"><rect class="part" x="-12" y="5.9" width="24" height="6.1"/><rect class="mate" x="-12" y="-5" width="24" height="10"/><rect class="part" x="-12" y="-12" width="24" height="6.1"/></g><path class="ctr" d="M -13.5,0 H 13.5 M 0,-13.5 V 13.5"/></g><path class="dim" d="M -271.684,130 L -271.684,346" stroke-dasharray="2 1.5"/><path class="dim" d="M 271.684,130 L 271.684,346" stroke-dasharray="2 1.5"/><path class="dim" d="M -271.684,342 H 271.684"/><path d="M -271.684,342 l 4,-1.4 v 2.8 z" fill="#b8156e"/><path d="M 271.684,342 l -4,-1.4 v 2.8 z" fill="#b8156e"/><text class="dimt" x="0" y="339.8" text-anchor="middle">20.90 mm</text><text class="call" x="0" y="354" text-anchor="middle">the full slice at &#177;5 mm; blade</text><path class="dim" d="M -271.684,153.4 L -271.684,372" stroke-dasharray="2 1.5"/><path class="dim" d="M 271.684,153.4 L 271.684,372" stroke-dasharray="2 1.5"/><path class="dim" d="M -271.684,368 H 271.684"/><path d="M -271.684,368 l 4,-1.4 v 2.8 z" fill="#b8156e"/><path d="M 271.684,368 l -4,-1.4 v 2.8 z" fill="#b8156e"/><text class="dimt" x="0" y="365.8" text-anchor="middle">20.90 mm</text><text class="call" x="0" y="380" text-anchor="middle">the full slice at &#177;5.9 mm; fork prong inner face</text><path class="dim" d="M -207.833,232.7 L -207.833,398" stroke-dasharray="2 1.5"/><path class="dim" d="M 207.833,232.7 L 207.833,398" stroke-dasharray="2 1.5"/><path class="dim" d="M -207.833,394 H 207.833"/><path d="M -207.833,394 l 4,-1.4 v 2.8 z" fill="#b8156e"/><path d="M 207.833,394 l -4,-1.4 v 2.8 z" fill="#b8156e"/><text class="dimt" x="0" y="391.8" text-anchor="middle">15.99 mm</text><text class="call" x="0" y="406" text-anchor="middle">the full slice at &#177;8.95 mm; halfway up the fork prong</text><path class="dim" d="M 352,-312 V -153.4"/><path d="M 352,-312 l -1.4,4 h 2.8 z" fill="#b8156e"/><path d="M 352,-153.4 l -1.4,-4 h 2.8 z" fill="#b8156e"/><text class="dimt" x="357" y="-231.2" text-anchor="start">fork prong 6.1 mm</text><path class="dim" d="M 352,-153.4 V -130"/><path d="M 352,-153.4 l -1.4,4 h 2.8 z" fill="#b8156e"/><path d="M 352,-130 l -1.4,-4 h 2.8 z" fill="#b8156e"/><text class="dimt" x="357" y="-140.2" text-anchor="start">gap 0.9 mm</text><path class="dim" d="M 352,-130 V 130"/><path d="M 352,-130 l -1.4,4 h 2.8 z" fill="#b8156e"/><path d="M 352,130 l -1.4,-4 h 2.8 z" fill="#b8156e"/><text class="dimt" x="357" y="1.5" text-anchor="start">blade 10 mm</text><path class="dim" d="M 430,-312 V 312"/><path d="M 430,-312 l -1.4,4 h 2.8 z" fill="#b8156e"/><path d="M 430,312 l -1.4,-4 h 2.8 z" fill="#b8156e"/><text class="dimt" x="432.6" y="0" text-anchor="middle" transform="rotate(-90 432.6 0)">fork span 24 mm</text><path class="dim" d="M 0,-312 L 436,-312" stroke-dasharray="2 1.5"/><path class="dim" d="M 271.684,-153.4 L 436,-153.4" stroke-dasharray="2 1.5"/><path class="dim" d="M 271.684,-130 L 436,-130" stroke-dasharray="2 1.5"/><path class="dim" d="M 271.684,130 L 436,130" stroke-dasharray="2 1.5"/><path class="dim" d="M 271.684,153.4 L 436,153.4" stroke-dasharray="2 1.5"/><path class="dim" d="M 0,312 L 436,312" stroke-dasharray="2 1.5"/><text class="lbl" x="0" y="-364" text-anchor="middle">THE FORK, SEEN DOWN THE LIMB</text><text class="note" x="0" y="-353" text-anchor="middle">Every layer is a full slice of the limb: &#216;24 mm, flatted to 20.90 mm across.</text><path class="dim" d="M -271.684,-336 H 271.684"/><path d="M -271.684,-336 l 4,-1.4 v 2.8 z" fill="#b8156e"/><path d="M 271.684,-336 l -4,-1.4 v 2.8 z" fill="#b8156e"/><text class="dimt" x="0" y="-338.2" text-anchor="middle">20.8988 mm across the flats</text><path class="dim" d="M -312,-324 H 312"/><path d="M -312,-324 l 4,-1.4 v 2.8 z" fill="#b8156e"/><path d="M 312,-324 l -4,-1.4 v 2.8 z" fill="#b8156e"/><text class="dimt" x="0" y="-326.2" text-anchor="middle">&#216;24 mm</text><text class="note" x="0" y="440" text-anchor="middle">The two flats are cut at &#177;10.4494 mm, which is where the &#216;24 mm surface crosses the seat wall at &#177;5.9 mm.</text><text class="note" x="0" y="451" text-anchor="middle">So the fork prong is a cap of the circle and the blade is the flat middle, 20.90 mm wide; the slot never bounds it sideways.</text><text class="note" x="0" y="462" text-anchor="middle">Draw a narrower paddle inside the slice and its corners bind before its faces do. Let every face run out to the section.</text></svg>