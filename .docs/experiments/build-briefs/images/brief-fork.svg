</style><g transform="scale(26,-26)" class="det"><clipPath id="limb"><path d="M 10.3923,-6 V 6 A 12,12 0 0 1 -10.3923,6 V -6 A 12,12 0 0 1 10.3923,-6 Z"/></clipPath><path class="ghost" d="M 10.3923,-6 V 6 A 12,12 0 0 1 -10.3923,6 V -6 A 12,12 0 0 1 10.3923,-6 Z"/><g clip-path="url(#limb)"><rect class="part" x="-12" y="6" width="24" height="6"/><rect class="mate" x="-12" y="-5" width="24" height="10"/><rect class="part" x="-12" y="-12" width="24" height="6"/></g><path class="ctr" d="M -13.5,0 H 13.5 M 0,-13.5 V 13.5"/></g><path class="dim" d="M -270.2,130 L -270.2,346" stroke-dasharray="2 1.5"/><path class="dim" d="M 270.2,130 L 270.2,346" stroke-dasharray="2 1.5"/><path class="dim" d="M -270.2,342 H 270.2"/><path d="M -270.2,342 l 4,-1.4 v 2.8 z" fill="#b8156e"/><path d="M 270.2,342 l -4,-1.4 v 2.8 z" fill="#b8156e"/><text class="dimt" x="0" y="339.8" text-anchor="middle">20.78 mm</text><text class="call" x="0" y="354" text-anchor="middle">the full slice at &#177;5 mm; blade</text><path class="dim" d="M -270.2,156 L -270.2,372" stroke-dasharray="2 1.5"/><path class="dim" d="M 270.2,156 L 270.2,372" stroke-dasharray="2 1.5"/><path class="dim" d="M -270.2,368 H 270.2"/><path d="M -270.2,368 l 4,-1.4 v 2.8 z" fill="#b8156e"/><path d="M 270.2,368 l -4,-1.4 v 2.8 z" fill="#b8156e"/><text class="dimt" x="0" y="365.8" text-anchor="middle">20.78 mm</text><text class="call" x="0" y="380" text-anchor="middle">the full slice at &#177;6 mm; ear inner face</text><path class="dim" d="M -206.369,234 L -206.369,398" stroke-dasharray="2 1.5"/><path class="dim" d="M 206.369,234 L 206.369,398" stroke-dasharray="2 1.5"/><path class="dim" d="M -206.369,394 H 206.369"/><path d="M -206.369,394 l 4,-1.4 v 2.8 z" fill="#b8156e"/><path d="M 206.369,394 l -4,-1.4 v 2.8 z" fill="#b8156e"/><text class="dimt" x="0" y="391.8" text-anchor="middle">15.87 mm</text><text class="call" x="0" y="406" text-anchor="middle">the full slice at &#177;9 mm; halfway up the ear</text><path class="dim" d="M 352,-312 V -156"/><path d="M 352,-312 l -1.4,4 h 2.8 z" fill="#b8156e"/><path d="M 352,-156 l -1.4,-4 h 2.8 z" fill="#b8156e"/><text class="dimt" x="357" y="-232.5" text-anchor="start">ear 6 mm</text><path class="dim" d="M 352,-156 V -130"/><path d="M 352,-156 l -1.4,4 h 2.8 z" fill="#b8156e"/><path d="M 352,-130 l -1.4,-4 h 2.8 z" fill="#b8156e"/><text class="dimt" x="357" y="-141.5" text-anchor="start">gap 1 mm</text><path class="dim" d="M 352,-130 V 130"/><path d="M 352,-130 l -1.4,4 h 2.8 z" fill="#b8156e"/><path d="M 352,130 l -1.4,-4 h 2.8 z" fill="#b8156e"/><text class="dimt" x="357" y="1.5" text-anchor="start">blade 10 mm</text><path class="dim" d="M 430,-312 V 312"/><path d="M 430,-312 l -1.4,4 h 2.8 z" fill="#b8156e"/><path d="M 430,312 l -1.4,-4 h 2.8 z" fill="#b8156e"/><text class="dimt" x="432.6" y="0" text-anchor="middle" transform="rotate(-90 432.6 0)">fork span 24 mm</text><path class="dim" d="M 0,-312 L 436,-312" stroke-dasharray="2 1.5"/><path class="dim" d="M 270.2,-156 L 436,-156" stroke-dasharray="2 1.5"/><path class="dim" d="M 270.2,-130 L 436,-130" stroke-dasharray="2 1.5"/><path class="dim" d="M 270.2,130 L 436,130" stroke-dasharray="2 1.5"/><path class="dim" d="M 270.2,156 L 436,156" stroke-dasharray="2 1.5"/><path class="dim" d="M 0,312 L 436,312" stroke-dasharray="2 1.5"/><text class="lbl" x="0" y="-364" text-anchor="middle">THE FORK, SEEN DOWN THE LIMB</text><text class="note" x="0" y="-353" text-anchor="middle">Every layer is a full slice of the limb: &#216;24 mm, flatted to 20.78 mm across.</text><path class="dim" d="M -270.2,-336 H 270.2"/><path d="M -270.2,-336 l 4,-1.4 v 2.8 z" fill="#b8156e"/><path d="M 270.2,-336 l -4,-1.4 v 2.8 z" fill="#b8156e"/><text class="dimt" x="0" y="-338.2" text-anchor="middle">20.7846 mm across the flats</text><path class="dim" d="M -312,-324 H 312"/><path d="M -312,-324 l 4,-1.4 v 2.8 z" fill="#b8156e"/><path d="M 312,-324 l -4,-1.4 v 2.8 z" fill="#b8156e"/><text class="dimt" x="0" y="-326.2" text-anchor="middle">&#216;24 mm</text><text class="note" x="0" y="440" text-anchor="middle">The two flats are cut at &#177;10.3923 mm, which is where the &#216;24 mm surface crosses the seat wall at &#177;6 mm.</text><text class="note" x="0" y="451" text-anchor="middle">So the ear is a cap of the circle and the blade is the flat middle, 20.78 mm wide; the slot never bounds it sideways.</text><text class="note" x="0" y="462" text-anchor="middle">Draw a narrower paddle inside the slice and its corners bind before its faces do. Let every face run out to the section.</text></svg>