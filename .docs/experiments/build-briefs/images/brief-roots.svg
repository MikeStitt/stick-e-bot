</style><g transform="scale(9,-9)" class="det"><circle class="ghost" cx="0" cy="0" r="10.4494"/><rect class="part" x="-12" y="0" width="24" height="38"/><rect class="mate" x="-12" y="-38" width="24" height="38"/><circle class="void" cx="0" cy="0" r="2"/><path class="ctr" d="M -15,0 H 15 M 0,-41 V 41"/></g><path class="dim" d="M 142,-189 V 0"/><path d="M 142,-189 l -1.4,4 h 2.8 z" fill="#b8156e"/><path d="M 142,0 l -1.4,-4 h 2.8 z" fill="#b8156e"/><text class="dimt" x="147" y="-93" text-anchor="start">fork free 21 mm</text><path class="dim" d="M 142,-342 V -189"/><path d="M 142,-342 l -1.4,4 h 2.8 z" fill="#b8156e"/><path d="M 142,-189 l -1.4,-4 h 2.8 z" fill="#b8156e"/><text class="dimt" x="147" y="-264" text-anchor="start">fork rod 17 mm</text><path class="dim" d="M -142,0 V 180"/><path d="M -142,0 l -1.4,4 h 2.8 z" fill="#b8156e"/><path d="M -142,180 l -1.4,-4 h 2.8 z" fill="#b8156e"/><text class="dimt" x="-147" y="91.5" text-anchor="end">blade free 20 mm</text><path class="dim" d="M -142,180 V 342"/><path d="M -142,180 l -1.4,4 h 2.8 z" fill="#b8156e"/><path d="M -142,342 l -1.4,-4 h 2.8 z" fill="#b8156e"/><text class="dimt" x="-147" y="262.5" text-anchor="end">blade rod 18 mm</text><path class="dim" d="M 238,-342 V 0"/><path d="M 238,-342 l -1.4,4 h 2.8 z" fill="#b8156e"/><path d="M 238,0 l -1.4,-4 h 2.8 z" fill="#b8156e"/><text class="dimt" x="240.6" y="-171" text-anchor="middle" transform="rotate(-90 240.6 -171)">pin to rod end 38 mm</text><path class="dim" d="M -238,0 V 342"/><path d="M -238,0 l -1.4,4 h 2.8 z" fill="#b8156e"/><path d="M -238,342 l -1.4,-4 h 2.8 z" fill="#b8156e"/><text class="dimt" x="-240.6" y="171" text-anchor="middle" transform="rotate(-90 -240.6 171)">pin to rod end 38 mm</text><path class="dim" d="M 108,-342 L 244,-342" stroke-dasharray="2 1.5"/><path class="dim" d="M -108,-342 L -244,-342" stroke-dasharray="2 1.5"/><path class="dim" d="M 108,-189 L 244,-189" stroke-dasharray="2 1.5"/><path class="dim" d="M -108,-189 L -244,-189" stroke-dasharray="2 1.5"/><path class="dim" d="M 108,0 L 244,0" stroke-dasharray="2 1.5"/><path class="dim" d="M -108,0 L -244,0" stroke-dasharray="2 1.5"/><path class="dim" d="M 108,180 L 244,180" stroke-dasharray="2 1.5"/><path class="dim" d="M -108,180 L -244,180" stroke-dasharray="2 1.5"/><path class="dim" d="M 108,342 L 244,342" stroke-dasharray="2 1.5"/><path class="dim" d="M -108,342 L -244,342" stroke-dasharray="2 1.5"/><text class="lbl" x="0" y="-382" text-anchor="middle">WHERE EACH ROD ROOTS</text><text class="note" x="0" y="-371" text-anchor="middle">Each member reaches 38 mm from the pin: its free length, then its rod.</text><text class="note" x="0" y="368" text-anchor="middle">The two free lengths differ because the blade's leaves bend and the fork's prongs do not.</text><text class="note" x="0" y="379" text-anchor="middle">A rod that starts short of its own root runs into the other member's swing, and both parts still measure right.</text></svg>