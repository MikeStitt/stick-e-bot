</style><text class="lbl" x="164" y="-292" text-anchor="middle">THE WEDGE</text><text class="call" x="-330" y="-266" text-anchor="middle">ONE WEDGE SQUARE ON</text><text class="call" x="-330" y="-256" text-anchor="middle">the crest is the base inset 0.75 mm all round</text><text class="call" x="300" y="-266" text-anchor="middle">THE PAIR IN SECTION</text><text class="call" x="300" y="-256" text-anchor="middle">developed on the r 9.2423 mm circle, where a flank bears</text><text class="note" x="164" y="190" text-anchor="middle">A 45&#176; draft is a planar inward offset by 0.75 mm, so the crest is the base inset 0.75 mm all round; and the offset is a length while the arc it eats is an angle.</text><text class="note" x="164" y="204" text-anchor="middle">So the crest narrows going inward. It would close to a point at r 4.3554 mm, which is well inside the ring's own inner end at r 6 mm, so on this ring it never does.</text><text class="note" x="164" y="218" text-anchor="middle">12 wedges to a face, at 30&#176; pitch, on the tongue and on each ear. The base is 3.4586 mm at the tip and 3.1990 mm where the section is taken.</text><text class="note" x="164" y="232" text-anchor="middle">The wedge is 19.8316&#176; across, which is wider than half a step. It has to be: both members are drafted, and by mid-gap each has leaned 0.5 mm away from the other.</text><text class="note" x="164" y="246" text-anchor="middle">That lean is worth 6.0388&#176; of extra width, and it is set half way up the gap at r 9.4923 mm, where the two radial draft ends have taken the least off the radius.</text><text class="note" x="164" y="260" text-anchor="middle">There the clearance comes to 0.20 mm, which is 2 T_PRINT; a flank turns 2.4144&#176; before it touches, and that is the backlash.</text><text class="note" x="164" y="274" text-anchor="middle">Riding, the two crests are flat on flat, 1.6974 mm of contact, and the pair has opened 0.5 mm. Nothing bottoms; the axle stays 0.60 mm into its &#216;4.4 mm bore while it does.</text><g transform="translate(-330,-40) scale(62,-62)" class="det"><path class="part" d="M -2.0858,-1.0332 A 6,6 0 0 1 -2.0858,1.0332 L 1.8469,1.7207 A 9.9923,9.9923 0 0 0 1.8469,-1.7207 Z"/><path class="mate" d="M -1.2590,-0.4164 L -1.2075,-0.4254 L -1.1561,-0.4344 L -1.1046,-0.4433 L -1.0532,-0.4523 L -1.0017,-0.4613 L -0.9503,-0.4703 L -0.8989,-0.4793 L -0.8474,-0.4883 L -0.7960,-0.4973 L -0.7446,-0.5063 L -0.6932,-0.5153 L -0.6417,-0.5243 L -0.5903,-0.5333 L -0.5389,-0.5422 L -0.4875,-0.5512 L -0.4361,-0.5602 L -0.3847,-0.5692 L -0.3333,-0.5782 L -0.2819,-0.5872 L -0.2305,-0.5962 L -0.1792,-0.6051 L -0.1278,-0.6141 L -0.0764,-0.6231 L -0.0250,-0.6321 L 0.0264,-0.6411 L 0.0777,-0.6500 L 0.1291,-0.6590 L 0.1805,-0.6680 L 0.2318,-0.6770 L 0.2832,-0.6860 L 0.3345,-0.6949 L 0.3859,-0.7039 L 0.4372,-0.7129 L 0.4886,-0.7219 L 0.5399,-0.7308 L 0.5913,-0.7398 L 0.6426,-0.7488 L 0.6939,-0.7578 L 0.7453,-0.7667 L 0.7966,-0.7757 L 0.8479,-0.7847 L 0.8993,-0.7937 L 0.9506,-0.8026 L 1.0019,-0.8116 L 1.0533,-0.8206 L 1.1046,-0.8295 L 1.1559,-0.8385 L 1.2072,-0.8475 L 1.2072,0.8475 L 1.1559,0.8385 L 1.1046,0.8295 L 1.0533,0.8206 L 1.0019,0.8116 L 0.9506,0.8026 L 0.8993,0.7937 L 0.8479,0.7847 L 0.7966,0.7757 L 0.7453,0.7667 L 0.6939,0.7578 L 0.6426,0.7488 L 0.5913,0.7398 L 0.5399,0.7308 L 0.4886,0.7219 L 0.4372,0.7129 L 0.3859,0.7039 L 0.3345,0.6949 L 0.2832,0.6860 L 0.2318,0.6770 L 0.1805,0.6680 L 0.1291,0.6590 L 0.0777,0.6500 L 0.0264,0.6411 L -0.0250,0.6321 L -0.0764,0.6231 L -0.1278,0.6141 L -0.1792,0.6051 L -0.2305,0.5962 L -0.2819,0.5872 L -0.3333,0.5782 L -0.3847,0.5692 L -0.4361,0.5602 L -0.4875,0.5512 L -0.5389,0.5422 L -0.5903,0.5333 L -0.6417,0.5243 L -0.6932,0.5153 L -0.7446,0.5063 L -0.7960,0.4973 L -0.8474,0.4883 L -0.8989,0.4793 L -0.9503,0.4703 L -1.0017,0.4613 L -1.0532,0.4523 L -1.1046,0.4433 L -1.1561,0.4344 L -1.2075,0.4254 L -1.2590,0.4164 Z"/></g><path class="dim" d="M -453.761,-192.682 H -206.239"/><path d="M -453.761,-192.682 l 4,-1.4 v 2.8 z" fill="#b8156e"/><path d="M -206.239,-192.682 l -4,-1.4 v 2.8 z" fill="#b8156e"/><text class="dimt" x="-330" y="-194.882" text-anchor="middle">the wedge is 3.9923 mm long</text><path class="dim" d="M -407.261,-176.682 H -252.739"/><path d="M -407.261,-176.682 l 4,-1.4 v 2.8 z" fill="#b8156e"/><path d="M -252.739,-176.682 l -4,-1.4 v 2.8 z" fill="#b8156e"/><text class="dimt" x="-330" y="-178.882" text-anchor="middle">the crest is 2.4923 mm long</text><path class="dim" d="M -180.239,12.5442 V -92.5442"/><path d="M -180.239,12.5442 l -1.4,4 h 2.8 z" fill="#b8156e"/><path d="M -180.239,-92.5442 l -1.4,-4 h 2.8 z" fill="#b8156e"/><text class="dimt" x="-175.239" y="-38.5" text-anchor="start">crest 1.6974 mm</text><path class="dim" d="M -431.261,-14.1855 V -65.8145"/><path d="M -431.261,-14.1855 l -1.4,4 h 2.8 z" fill="#b8156e"/><path d="M -431.261,-65.8145 l -1.4,-4 h 2.8 z" fill="#b8156e"/><text class="dimt" x="-436.261" y="-38.5" text-anchor="end">0.8333 mm</text><path class="dim" d="M -453.761,-152.682 L -453.761,-196.682" stroke-dasharray="2 1.5"/><path class="dim" d="M -407.261,-152.682 L -407.261,-196.682" stroke-dasharray="2 1.5"/><path class="dim" d="M -252.739,-152.682 L -252.739,-196.682" stroke-dasharray="2 1.5"/><path class="dim" d="M -206.239,-152.682 L -206.239,-196.682" stroke-dasharray="2 1.5"/><path class="dim" d="M -255.153,-92.5442 L -174.239,-92.5442" stroke-dasharray="2 1.5"/><text class="call" x="-480" y="110.682" text-anchor="start">the crest, radius by radius</text><text class="call" x="-480" y="126.682" text-anchor="start">r  9.2423 mm &#8212; 1.6974 mm wide</text><text class="call" x="-480" y="139.682" text-anchor="start">r  9.0000 mm &#8212; 1.6134 mm wide</text><text class="call" x="-480" y="152.682" text-anchor="start">r  8.0000 mm &#8212; 1.2668 mm wide</text><text class="call" x="-480" y="165.682" text-anchor="start">r  7.0000 mm &#8212; 0.9200 mm wide</text><text class="call" x="-480" y="178.682" text-anchor="start">r  6.7500 mm &#8212; 0.8333 mm wide</text><g transform="translate(300,-126) scale(40,-40)" class="det"><rect class="mate" x="-7.25889" y="-0.6" width="14.5178" height="0.6"/><path class="mate" d="M -6.4388,0 L -5.6879,0.75 L -3.9906,0.75 L -3.2398,0 Z"/><path class="mate" d="M -1.5995,0 L -0.8487,0.75 L 0.8487,0.75 L 1.5995,0 Z"/><path class="mate" d="M 3.2398,0 L 3.9906,0.75 L 5.6879,0.75 L 6.4388,0 Z"/><rect class="part" x="-7.25889" y="1" width="14.5178" height="0.6"/><path class="part" d="M -4.0191,1 L -3.2683,0.25 L -1.5709,0.25 L -0.8201,1 Z"/><path class="part" d="M 0.8201,1 L 1.5709,0.25 L 3.2683,0.25 L 4.0191,1 Z"/></g><g transform="translate(300,100) scale(40,-40)" class="det"><rect class="mate" x="-7.25889" y="-0.6" width="14.5178" height="0.6"/><path class="mate" d="M -6.4388,0 L -5.6879,0.75 L -3.9906,0.75 L -3.2398,0 Z"/><path class="mate" d="M -1.5995,0 L -0.8487,0.75 L 0.8487,0.75 L 1.5995,0 Z"/><path class="mate" d="M 3.2398,0 L 3.9906,0.75 L 5.6879,0.75 L 6.4388,0 Z"/><rect class="part" x="-7.25889" y="1.5" width="14.5178" height="0.6"/><path class="part" d="M -6.4388,1.5 L -5.6879,0.75 L -3.9906,0.75 L -3.2398,1.5 Z"/><path class="part" d="M -1.5995,1.5 L -0.8487,0.75 L 0.8487,0.75 L 1.5995,1.5 Z"/><path class="part" d="M 3.2398,1.5 L 3.9906,0.75 L 5.6879,0.75 L 6.4388,1.5 Z"/></g><text class="call" x="300" y="-244" text-anchor="middle">SEATED AT A DETENT</text><path class="dim" d="M 106.43,-226 H 300"/><path d="M 106.43,-226 l 4,-1.4 v 2.8 z" fill="#b8156e"/><path d="M 300,-226 l -4,-1.4 v 2.8 z" fill="#b8156e"/><text class="dimt" x="203.215" y="-228.2" text-anchor="middle">pitch 4.8393 mm</text><path class="dim" d="M 338.377,-156 L 338.377,-202" stroke-dasharray="2 1.5"/><text class="call" x="338.377" y="-204" text-anchor="start">0.2215 mm free between the crest corner and the facing flank</text><path class="dim" d="M 616.356,-166 V -126"/><path d="M 616.356,-166 l -1.4,4 h 2.8 z" fill="#b8156e"/><path d="M 616.356,-126 l -1.4,-4 h 2.8 z" fill="#b8156e"/><t