</style><text class="lbl" x="164" y="-292" text-anchor="middle">THE WEDGE</text><text class="call" x="-330" y="-266" text-anchor="middle">ONE WEDGE SQUARE ON</text><text class="call" x="-330" y="-256" text-anchor="middle">the crest is the base inset 0.75 mm all round</text><text class="call" x="300" y="-266" text-anchor="middle">THE PAIR IN SECTION</text><text class="call" x="300" y="-256" text-anchor="middle">developed on the r 9.6994 mm circle, where a flank bears</text><text class="note" x="164" y="190" text-anchor="middle">A 45&#176; draft is a planar inward offset by 0.75 mm, so the crest is the base inset 0.75 mm all round; and the offset is a length while the arc it eats is an angle.</text><text class="note" x="164" y="204" text-anchor="middle">So the crest narrows going inward, and it closes to a point at r 7.4777 mm. That is inside the ring, which runs r 6 mm to r 10.4494 mm, so the inner 1.4777 mm of the ring's 4.4494 mm carries no crest at all &#8212; the flanks meet there and the wedge is a knife edge.</text><text class="note" x="164" y="218" text-anchor="middle">24 wedges to a face, at 15&#176; pitch, on the blade blank and on each fork prong. The base is 2.0996 mm at the tip and 1.9489 mm where the section is taken.</text><text class="note" x="164" y="232" text-anchor="middle">The wedge is 11.5127&#176; across, which is wider than half a step. It has to be: both members are drafted, and by mid-gap each has leaned 0.45 mm away from the other.</text><text class="note" x="164" y="246" text-anchor="middle">That lean is worth 5.1587&#176; of extra width, and it is set half way up the gap at r 9.9994 mm, where the two radial draft ends have taken the least off the radius.</text><text class="note" x="164" y="260" text-anchor="middle">There the clearance comes to 0.20 mm, which is 2 T_PRINT; a flank turns 2.2920&#176; before it touches, and that is the backlash.</text><text class="note" x="164" y="274" text-anchor="middle">Riding, the two crests are flat on flat, 0.4474 mm of contact, and the pair has opened 0.6 mm. Nothing bottoms; the axle stays 1.50 mm into its &#216;4.1 mm bore while it does.</text><g transform="translate(-330,-40) scale(62,-62)" class="det"><path class="part" d="M -2.2550,-0.6018 A 6,6 0 0 1 -2.2550,0.6018 L 2.1720,1.0481 A 10.4494,10.4494 0 0 0 2.1720,-1.0481 Z"/><path class="mate" d="M -0.7470,-0.0000 L -0.7007,-0.0047 L -0.6544,-0.0093 L -0.6082,-0.0140 L -0.5619,-0.0187 L -0.5156,-0.0233 L -0.4693,-0.0280 L -0.4231,-0.0327 L -0.3768,-0.0373 L -0.3305,-0.0420 L -0.2843,-0.0466 L -0.2380,-0.0513 L -0.1918,-0.0560 L -0.1455,-0.0606 L -0.0993,-0.0653 L -0.0530,-0.0700 L -0.0068,-0.0746 L 0.0395,-0.0793 L 0.0857,-0.0839 L 0.1320,-0.0886 L 0.1782,-0.0933 L 0.2244,-0.0979 L 0.2707,-0.1026 L 0.3169,-0.1072 L 0.3631,-0.1119 L 0.4093,-0.1166 L 0.4556,-0.1212 L 0.5018,-0.1259 L 0.5480,-0.1305 L 0.5942,-0.1352 L 0.6405,-0.1399 L 0.6867,-0.1445 L 0.7329,-0.1492 L 0.7791,-0.1538 L 0.8253,-0.1585 L 0.8715,-0.1632 L 0.9177,-0.1678 L 0.9639,-0.1725 L 1.0101,-0.1771 L 1.0564,-0.1818 L 1.1026,-0.1864 L 1.1488,-0.1911 L 1.1950,-0.1958 L 1.2412,-0.2004 L 1.2873,-0.2051 L 1.3335,-0.2097 L 1.3797,-0.2144 L 1.4259,-0.2190 L 1.4721,-0.2237 L 1.4721,0.2237 L 1.4259,0.2190 L 1.3797,0.2144 L 1.3335,0.2097 L 1.2873,0.2051 L 1.2412,0.2004 L 1.1950,0.1958 L 1.1488,0.1911 L 1.1026,0.1864 L 1.0564,0.1818 L 1.0101,0.1771 L 0.9639,0.1725 L 0.9177,0.1678 L 0.8715,0.1632 L 0.8253,0.1585 L 0.7791,0.1538 L 0.7329,0.1492 L 0.6867,0.1445 L 0.6405,0.1399 L 0.5942,0.1352 L 0.5480,0.1305 L 0.5018,0.1259 L 0.4556,0.1212 L 0.4093,0.1166 L 0.3631,0.1119 L 0.3169,0.1072 L 0.2707,0.1026 L 0.2244,0.0979 L 0.1782,0.0933 L 0.1320,0.0886 L 0.0857,0.0839 L 0.0395,0.0793 L -0.0068,0.0746 L -0.0530,0.0700 L -0.0993,0.0653 L -0.1455,0.0606 L -0.1918,0.0560 L -0.2380,0.0513 L -0.2843,0.0466 L -0.3305,0.0420 L -0.3768,0.0373 L -0.4231,0.0327 L -0.4693,0.0280 L -0.5156,0.0233 L -0.5619,0.0187 L -0.6082,0.0140 L -0.6544,0.0093 L -0.7007,0.0047 L -0.7470,0.0000 Z"/></g><path class="dim" d="M -467.931,-150.979 H -192.069"/><path d="M -467.931,-150.979 l 4,-1.4 v 2.8 z" fill="#b8156e"/><path d="M -192.069,-150.979 l -4,-1.4 v 2.8 z" fill="#b8156e"/><text class="dimt" x="-330" y="-153.179" text-anchor="middle">the wedge is 4.4494 mm long</text><path class="dim" d="M -376.314,-134.979 H -238.569"/><path d="M -376.314,-134.979 l 4,-1.4 v 2.8 z" fill="#b8156e"/><path d="M -238.569,-134.979 l -4,-1.4 v 2.8 z" fill="#b8156e"/><text class="dimt" x="-307.441" y="-137.179" text-anchor="middle">the crest is 2.2217 mm long</text><path class="dim" d="M -166.069,-26.1305 V -53.8695"/><path d="M -166.069,-26.1305 l -1.4,4 h 2.8 z" fill="#b8156e"/><path d="M -166.069,-53.8695 l -1.4,-4 h 2.8 z" fill="#b8156e"/><text class="dimt" x="-161.069" y="-38.5" text-anchor="start">crest 0.4474 mm</text><text class="call" x="-386.314" y="-46" text-anchor="end">the crest ends here, r 7.4777 mm</text><path class="dim" d="M -467.931,-110.979 L -467.931,-154.979" stroke-dasharray="2 1.5"/><path class="dim" d="M -421.431,-110.979 L -421.431,-154.979" stroke-dasharray="2 1.5"/><path class="dim" d="M -238.569,-110.979 L -238.569,-154.979" stroke-dasharray="2 1.5"/><path class="dim" d="M -192.069,-110.979 L -192.069,-154.979" stroke-dasharray="2 1.5"/><path class="dim" d="M -238.729,-53.8695 L -160.069,-53.8695" stroke-dasharray="2 1.5"/><text class="call" x="-480" y="68.9795" text-anchor="start">the crest, radius by radius</text><text class="call" x="-480" y="84.9795" text-anchor="start">r  9.6994 mm &#8212; 0.4474 mm wide</text><text class="call" x="-480" y="97.9795" text-anchor="start">r  9.0000 mm &#8212; 0.3067 mm wide</text><text class="call" x="-480" y="110.979" text-anchor="start">r  8.0000 mm &#8212; 0.1053 mm wide</text><text class="call" x="-480" y="123.979" text-anchor="start">r  7.4777 mm &#8212; 0.0000 mm wide</text><text class="call" x="-480" y="136.979" text-anchor="start">r  6.7500 mm &#8212; no crest; the flanks have already met</text><g transform="translate(300,-126) scale(40,-40)" class="det"><rect class="mate" x="-3.80895" y="-0.6" width="7.61789" height="0.6"/><path class="mate" d="M -3.5138,0 L -2.7630,0.75 L -2.3156,0.75 L -1.5648,0 Z"/><path class="mate" d="M -0.9745,0 L -0.2237,0.75 L 0.2237,0.75 L 0.9745,0 Z"/><path class="mate" d="M 1.5648,0 L 2.3156,0.75 L 2.7630,0.75 L 3.5138,0 Z"/><rect class="part" x="-3.80895" y="0.9" width="7.61789" height="0.6"/><path class="part" d="M -2.2441,0.9 L -1.4934,0.15 L -1.0459,0.15 L -0.2952,0.9 Z"/><path class="part" d="M 0.2952,0.9 L 1.0459,0.15 L 1.4934,0.15 L 2.2441,0.9 Z"/></g><g transform="translate(300,100) scale(40,-40)" class="det"><rect class="mate" x="-3.80895" y="-0.6" width="7.61789" height="0.6"/><path class="mate" d="M -3.5138,0 L -2.7630,0.75 L -2.3156,0.75 L -1.5648,0 Z"/><path class="mate" d="M -0.9745,0 L -0.2237,0.75 L 0.2237,0.75 L 0.9745,0 Z"/><path class="mate" d="M 1.5648,0 L 2.3156,0.75 L 2.7630,0.75 L 3.5138,0 Z"/><rect class="part" x="-3.80895" y="1.5" width="7.61789" height="0.6"/><path class="part" d="M -3.5138,1.5 L -2.7630,0.75 L -2.3156,0.75 L -1.5648,1.5 Z"/><path class="part" d="M -0.9745,1.5 L -0.2237,0.75 L 0.2237,0.75 L 0.9745,1.5 Z"/><path class="part" d="M 1.5648,1.5 L 2.3156,0.75 L 2.7630,0.75 L 3.5138,1.5 Z"/></g><text class="call" x="300" y="-244" text-anchor="middle">SEATED AT A DETENT</text><path class="dim" d="M 198.428,-226 H 300"/><path d="M 198.428,-226 l 4,-1.4 v 2.8 z" fill="#b8156e"/><path d="M 300,-226 l -4,-1.4 v 2.8 z" fill="#b8156e"/><text class="dimt" x="249.214" y="-228.2" text-anchor="middle">pitch 2.5393 mm</text><path class="dim" d="M 313.378,-156 L 313.378,-198" stroke-dasharray="2 1.5"/><text class="call" x="313.378" y="-200" text-anchor="start">0.2215 mm free between the crest corner and the facing flank</text><path class="dim" d="M 478.358,-162 V -126"/><path d="M 478.358,-162 l -1.4,4 h 2.8 z" fill="#b8156e"/><path d="M 478.358,-126 l -1.4,-4 h 2.8 z" fill="#b8156e"/><text class="dimt" x="483.358" y="-142.5" text-anchor="start">gap 0.9 mm</text><path class="dim" d="M 574.358,-162 V -156"/><path d="M 574.358,-162 l -1.4,4 h 2.8 z" fill="#b8156e"/><path d="M 574.358,-156 l -1.4,-4 h 2.8 z" fill="#b8156e"/><text class="dimt" x="579.358" y="-157.5" text-anchor="start">clearance 0.15 mm</text><path class="dim" d="M 121.642,-156 V -126"/><path d="M 121.642,-156 l -1.4,4 h 2.8 z" fill="#b8156e"/><path d="M 121.642,-126 l -1.4,-4 h 2.8 z" fill="#b8156e"/><text class="dimt" x="119.042" y="-141" text-anchor="middle" transform="rotate(-90 119.042 -141)">proud 0.75 mm</text><text class="call" x="300" y="-18" text-anchor="middle">RIDING, CREST ON CREST</text><path class="dim" d="M 478.358,40 V 100"/><path d="M 478.358,40 l -1.4,4 h 2.8 z" fill="#b8156e"/><path d="M 478.358,100 l -1.4,-4 h 2.8 z" fill="#b8156e"/><text class="dimt" x="483.358" y="71.5" text-anchor="start">1.5 mm</text><path class="dim" d="M 574.358,40 V 64"/><path d="M 574.358,40 l -1.4,4 h 2.8 z" fill="#b8156e"/><path d="M 574.358,64 l -1.4,-4 h 2.8 z" fill="#b8156e"/><text class="dimt" x="579.358" y="53.5" text-anchor="start">climb 0.6 mm</text><path class="dim" d="M 452.358,-162 L 580.358,-162" stroke-dasharray="2 1.5"/><path class="dim" d="M 452.358,-126 L 484.358,-126" stroke-dasharray="2 1.5"/><path class="dim" d="M 452.358,-156 L 580.358,-156" stroke-dasharray="2 1.5"/><path class="dim" d="M 147.642,-156 L 115.642,-156" stroke-dasharray="2 1.5"/><path class="dim" d="M 147.642,-126 L 115.642,-126" stroke-dasharray="2 1.5"/><path class="dim" d="M 452.358,40 L 580.358,40" stroke-dasharray="2 1.5"/><path class="dim" d="M 452.358,100 L 484.358,100" stroke-dasharray="2 1.5"/><path class="dim" d="M 548.358,64 L 580.358,64" stroke-dasharray="2 1.5"/></svg>