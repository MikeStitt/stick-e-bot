</style><text class="lbl" x="164" y="-292" text-anchor="middle">THE WEDGE</text><text class="call" x="-330" y="-266" text-anchor="middle">ONE WEDGE SQUARE ON</text><text class="call" x="-330" y="-256" text-anchor="middle">the crest is the base inset 0.75 mm all round</text><text class="call" x="300" y="-266" text-anchor="middle">THE PAIR IN SECTION</text><text class="call" x="300" y="-256" text-anchor="middle">developed on the r 9.6994 mm circle, where a flank bears</text><text class="note" x="164" y="190" text-anchor="middle">A 45&#176; draft is a planar inward offset by 0.75 mm, so the crest is the base inset 0.75 mm all round; and the offset is a length while the arc it eats is an angle.</text><text class="note" x="164" y="204" text-anchor="middle">So the crest narrows going inward. It would close to a point at r 7.4777 mm, which is well inside the ring's own inner end at r 6 mm, so on this ring it never does.</text><text class="note" x="164" y="218" text-anchor="middle">24 wedges to a face, at 15&#176; pitch, on the tongue and on each ear. The base is 2.0996 mm at the tip and 1.9489 mm where the section is taken.</text><text class="note" x="164" y="232" text-anchor="middle">The wedge is 11.5127&#176; across, which is wider than half a step. It has to be: both members are drafted, and by mid-gap each has leaned 0.45 mm away from the other.</text><text class="note" x="164" y="246" text-anchor="middle">That lean is worth 5.1587&#176; of extra width, and it is set half way up the gap at r 9.9994 mm, where the two radial draft ends have taken the least off the radius.</text><text class="note" x="164" y="260" text-anchor="middle">There the clearance comes to 0.20 mm, which is 2 T_PRINT; a flank turns 2.2920&#176; before it touches, and that is the backlash.</text><text class="note" x="164" y="274" text-anchor="middle">Riding, the two crests are flat on flat, 0.4474 mm of contact, and the pair has opened 0.6 mm. Nothing bottoms; the axle stays 1.50 mm into its &#216;4.1 mm bore while it does.</text><g transform="translate(-330,-40) scale(62,-62)" class="det"><path class="part" d="M -2.2550,-0.6018 A 6,6 0 0 1 -2.2550,0.6018 L 2.1720,1.0481 A 10.4494,10.4494 0 0 0 2.1720,-1.0481 Z"/><path class="mate" d="M -1.4751,0.0734 L -1.4136,0.0672 L -1.3521,0.0610 L -1.2906,0.0548 L -1.2291,0.0486 L -1.1676,0.0424 L -1.1061,0.0362 L -1.0446,0.0300 L -0.9832,0.0238 L -0.9217,0.0176 L -0.8603,0.0114 L -0.7988,0.0052 L -0.7374,-0.0010 L -0.6759,-0.0072 L -0.6145,-0.0134 L -0.5530,-0.0196 L -0.4916,-0.0257 L -0.4302,-0.0319 L -0.3688,-0.0381 L -0.3074,-0.0443 L -0.2459,-0.0505 L -0.1845,-0.0567 L -0.1231,-0.0629 L -0.0617,-0.0691 L -0.0003,-0.0753 L 0.0610,-0.0815 L 0.1224,-0.0876 L 0.1838,-0.0938 L 0.2452,-0.1000 L 0.3066,-0.1062 L 0.3679,-0.1124 L 0.4293,-0.1186 L 0.4907,-0.1248 L 0.5520,-0.1310 L 0.6134,-0.1371 L 0.6748,-0.1433 L 0.7361,-0.1495 L 0.7975,-0.1557 L 0.8588,-0.1619 L 0.9201,-0.1681 L 0.9815,-0.1742 L 1.0428,-0.1804 L 1.1042,-0.1866 L 1.1655,-0.1928 L 1.2268,-0.1990 L 1.2882,-0.2052 L 1.3495,-0.2113 L 1.4108,-0.2175 L 1.4721,-0.2237 L 1.4721,0.2237 L 1.4108,0.2175 L 1.3495,0.2113 L 1.2882,0.2052 L 1.2268,0.1990 L 1.1655,0.1928 L 1.1042,0.1866 L 1.0428,0.1804 L 0.9815,0.1742 L 0.9201,0.1681 L 0.8588,0.1619 L 0.7975,0.1557 L 0.7361,0.1495 L 0.6748,0.1433 L 0.6134,0.1371 L 0.5520,0.1310 L 0.4907,0.1248 L 0.4293,0.1186 L 0.3679,0.1124 L 0.3066,0.1062 L 0.2452,0.1000 L 0.1838,0.0938 L 0.1224,0.0876 L 0.0610,0.0815 L -0.0003,0.0753 L -0.0617,0.0691 L -0.1231,0.0629 L -0.1845,0.0567 L -0.2459,0.0505 L -0.3074,0.0443 L -0.3688,0.0381 L -0.4302,0.0319 L -0.4916,0.0257 L -0.5530,0.0196 L -0.6145,0.0134 L -0.6759,0.0072 L -0.7374,0.0010 L -0.7988,-0.0052 L -0.8603,-0.0114 L -0.9217,-0.0176 L -0.9832,-0.0238 L -1.0446,-0.0300 L -1.1061,-0.0362 L -1.1676,-0.0424 L -1.2291,-0.0486 L -1.2906,-0.0548 L -1.3521,-0.0610 L -1.4136,-0.0672 L -1.4751,-0.0734 Z"/></g><path class="dim" d="M -467.931,-150.979 H -192.069"/><path d="M -467.931,-150.979 l 