er 98.62 mm</text><line class="stn" x1="-58" y1="32" x2="58" y2="32"/><text class="call" x="-60" y="33.2" text-anchor="end">neck 118 mm</text><line class="stn" x1="-58" y1="15.35" x2="58" y2="15.35"/><text class="call" x="-60" y="16.55" text-anchor="end">head center 134.65 mm</text><g class="dim"><path d="M -70 -2.65 H -78 M -70 150 H -78"/><path d="M -75 -2.65 V 150"/><path d="M -75 -2.65 l -1.4 4 h 2.8 z" fill="#b8156e"/><path d="M -75 150 l -1.4 -4 h 2.8 z" fill="#b8156e"/></g><text class="dimt" x="-79" y="73.675" text-anchor="middle" transform="rotate(-90 -79 73.675)">152.65 mm</text><path class="lead" d="M0,9.35 L62,-0.65"/><text class="call" x="64" y="0.55" text-anchor="start">head</text><path class="lead" d="M0,32 L62,32"/><text class="call" x="64" y="33.2" text-anchor="start">neck ball joint</text><path class="lead" d="M14,45 L62,41"/><text class="call" x="64" y="42.2" text-anchor="start">torso</text><path class="lead" d="M27.7754,60.3823 L62,57.3823"/><text class="call" x="64" y="58.5823" text-anchor="start">upper arm</text><path class="lead" d="M2.4,61 L62,63.8823"/><text class="call" x="64" y="65.0823" text-anchor="start">origin &#8212; center of the torso</text><path class="lead" d="M39.8918,81.481 L62,81.481"/><text class="call" x="64" y="82.681" text-anchor="start">forearm</text><path class="lead" d="M36.9545,101.968 L62,98.9677"/><text class="call" x="64" y="100.168" text-anchor="start">gripper</text><path class="lead" d="M18,110 L62,110"/><text class="call" x="64" y="111.2" text-anchor="start">thigh</text><path class="lead" d="M12,126 L62,126"/><text class="call" x="64" y="127.2" text-anchor="start">shin</text><path class="lead" d="M20,144 L62,142"/><text class="call" x="64" y="143.2" text-anchor="start">foot</text></g><g transform="translate(196,0)"><rect class="part" x="-12" y="37" width="24" height="48"/><rect class="part" x="-1.5" y="30" width="3" height="7"/><circle class="part" cx="0" cy="32" r="3"/><rect class="part" x="-15" y="-2.65" width="30" height="36"/><rect class="part" x="-6" y="90" width="12" height="24"/><rect class="part" x="-6" y="114" width="12" height="24"/><path class="part" d="M -20,150 h 48 a 5 5 0 0 0 -1 -8 q -14 -4 -46 -4 a 5 5 0 0 0 -1 12 z"/><rect class="part" x="-2.0882" y="85" width="12" height="21.711"/><rect class="hid" x="-2.0882" y="51.3823" width="12" height="33.6177"/><line class="ctr" x1="0" y1="-8.65" x2="0" y2="156"/><line class="gnd" x1="-26" y1="150" x2="34" y2="150"/><g class="dim"><path d="M -12 85 V 90 M 12 85 V 90"/><path d="M -12 88.5 H 12"/><path d="M -12 88.5 l 4 -1.4 v 2.8 z" fill="#b8156e"/><path d="M 12 88.5 l -4 -1.4 v 2.8 z" fill="#b8156e"/></g><text class="dimt" x="-14" y="87.5" text-anchor="end">24 mm</text><path class="lead" d="M3.9118,98.711 L26,102.711"/><text class="call" x="27" y="103.711" text-anchor="start">both arms, edge-on</text><text class="note" x="4" y="168" text-anchor="middle">The arms lie in one plane 3.91 mm forward of center,</text><text class="note" x="4" y="174" text-anchor="middle">so this view sees them edge-on and both at once. Dashed</text><text class="note" x="4" y="180" text-anchor="middle">where the torso is in front of them.</text></g><text class="lbl" x="0" y="-10" text-anchor="middle">FRONT</text><text class="lbl" x="196" y="-10" text-anchor="middle">SIDE</text><text class="lbl" x="-86" y="-52" text-anchor="start">SHEET 1 &#8212; ASSEMBLED</text><text class="note" x="-86" y="-44" text-anchor="start">The parts from sheet 2, assembled. Joint centers sit on their station lines, and every station is derived &#8212; nothing is fitted to a round height.</text><text class="note" x="-86" y="-38" text-anchor="start">Shoulder stud 53&#176; down and 30&#176; forward, 13 mm long: a &#216;8 boss coaxial with the last 5 mm of &#216;3 stalk, cut flush at the torso's top face.</text><text class="note" x="-86" y="-32" text-anchor="start">That puts the ball 6.78 mm clear of the side, so a &#216;12 arm swings anywhere the socket allows &#8212; -0.11&#176; to 66.36&#176; from vertical.</text><text class="note" x="-86" y="-26" text-anchor="start">The arm is drawn at 33.13&#176;, hanging 17.51&#176; off the stud. All of that is fore-and-aft, so it stays in one plane and this view reads true length.</text><text class="note" x="-86" y="-20" text-anchor="start">Elbows bent 45&#176;; the gripper's bore runs fore-and-aft, so its hole stays a full circle.</text><text class="note" x="-86" y="198" text-anchor="start">Session 1 builds the neck as a plain &#216;12 mm post. It becomes the ball joint shown here once joints are taught.</text></svg>