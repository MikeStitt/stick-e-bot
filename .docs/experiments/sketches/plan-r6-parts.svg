  .name  { fill:#12303c; font-size:5px; font-weight:700; letter-spacing:0.06em; }
  .call  { fill:#43525e; font-size:3.4px; }
  .lead  { stroke:#8ea0ad; stroke-width:0.3; fill:none; }
  .lbl   { fill:#43525e; font-size:4.6px; font-weight:700; letter-spacing:0.12em; }
  .note  { fill:#6b7a88; font-size:3.6px; }
  .warn  { fill:#b8156e; font-size:3.6px; font-weight:700; }
  .ctr   { stroke:#7f8f9c; stroke-width:0.3; stroke-dasharray:6 2 1 2; }
  .stn   { stroke:#0b6e86; stroke-width:0.25; stroke-dasharray:3 2; }
  .gnd   { stroke:#0b6e86; stroke-width:0.8; }
  .tooth { stroke:#1d262e; stroke-width:0.5; fill:none; }
  .det * { vector-effect: non-scaling-stroke; }
  .fig * { vector-effect: non-scaling-stroke; }
  .fig .call { font-size:6.8162px; }
  .fig .note { font-size:7.21715px; }
  .fig .name { font-size:10.0238px; }
  .fig .dimt { font-size:8.42001px; }
  .fig .lbl { font-size:9.22192px; }
  .fig .warn { font-size:7.21715px; }
</style><g transform="translate(60,60)"><g class="fig" transform="scale(0.498812)"><clipPath id="shp0"><rect x="-400" y="-48" width="800" height="800"/></clipPath><g clip-path="url(#shp0)"><path class="part" d="M -36.000,-54.638 L -51.039,-31.594 L -37.639,-22.850 L -36.000,-25.362 Z"/><rect class="part" x="-3" y="0" width="6" height="9.53653" transform="translate(-44.3390,-27.2218) rotate(33.1283)"/></g><clipPath id="shp1"><rect x="-400" y="-48" width="800" height="800"/></clipPath><g clip-path="url(#shp1)"><path class="part" d="M 36.000,-54.638 L 51.039,-31.594 L 37.639,-22.850 L 36.000,-25.362 Z"/><rect class="part" x="-3" y="0" width="6" height="9.53653" transform="translate(44.3390,-27.2218) rotate(-33.1283)"/></g><rect class="part" x="-36" y="-48" width="72" height="96"/><circle class="part" cx="-49.5509" cy="-19.2355" r="6"/><circle class="part" cx="49.5509" cy="-19.2355" r="6"/><rect class="part" x="-3" y="-58" width="6" height="10"/><circle class="part" cx="0" cy="-58" r="6"/><rect class="part" x="-15" y="48" width="6" height="10"/><circle class="part" cx="-12" cy="58" r="6"/><rect class="part" x="9" y="48" width="6" height="10"/><circle class="part" cx="12" cy="58" r="6"/><line class="ctr" x1="0" y1="-62" x2="0" y2="62"/><path class="lead" d="M-2.6,-59.5 L-14,-61"/><text class="call" x="-30.0715" y="-72.0572" text-anchor="end">+ neck ball stud</text><path class="lead" d="M52.5509,-19.2355 L52,-44"/><text class="call" x="54.0048" y="-41.9952" text-anchor="start">+ shoulder ball stud</text><text class="call" x="54.0048" y="-32.7733" text-anchor="start">53&#176; down, 30&#176; forward</text><path class="lead" d="M39,-45 L52,-25"/><text class="call" x="54.0048" y="-22.9952" text-anchor="start">&#216;16 boss on the same axis,</text><text class="call" x="54.0048" y="-13.7733" text-anchor="start">cut flush at the top face</text><path class="lead" d="M12,61 L12,61 L26,61"/><text class="call" x="54.1286" y="76.0667" text-anchor="start">+ hip ball stud</text><text class="name" x="0" y="96.1143" text-anchor="middle">TORSO</text><text class="note" x="0" y="110.148" text-anchor="middle">72 &#215; 96 &#215; 48 mm</text></g></g><g transform="translate(185,52)"><g class="fig" transform="scale(0.498812)"><path class="part" d="M -36,36 V 0 A 36,36 0 0 1 36,0 V 36 Z"/><ellipse class="part" cx="-12" cy="-8" rx="8" ry="4"/><ellipse class="part" cx="12" cy="-8" rx="8" ry="4"/><rect class="part" x="-20" y="13" width="40" height="10" rx="5"/><rect class="part" x="-9" y="36" width="18" height="11"/><path class="void" d="M -5.76,47 A 6.08,6.08 0 1 1 5.76,47 Z"/><path class="hid" d="M -0.8,36 V 47 M 0.8,36 V 47"/><path class="lead" d="M9,41.5 L16,40"/><text class="call" x="34.081" y="46.0238" text-anchor="start">+ neck socket, collar &#216;18</text><text class="call" x="34.081" y="56.0476" text-anchor="start">11 mm proud, four 1.6 slits</text><path class="lead" d="M12,-8 L40.0953,-40.0953"/><text class="call" x="42.1001" y="-40.0953" text-anchor="start">eye</text><path class="lead" d="M10,18 L40.0953,32.0762"/><text class="call" x="42.1001" y="34.081" text-anchor="start">mouth &#8212; slot</text><text class="name" x="0" y="71.0572" text-anchor="middle">HEAD</text><text class="note" x="0" y="85.0905" text-anchor="middle">72 &#215; 72 &#215; 60 mm</text><text class="note" x="0" y="99.1239" text-anchor="middle">arch r36, top edges rounded r12</text></g></g><g transform="translate(310,22)"><g class="fig" transform="scale(0.498812)"><rect class="part" x="-12" y="0" width="24" height="53"/><path class="void" d="M -12,-0.76 A 6.08,6.08 0 1 0 -12,10.76 Z"/><path class="part" d="M -12,47 L -12,53 A 12,12 0 0 0 12,53 L 12,47 Z"/><circle class="void" cx="0" cy="53" r="2.2"/><path class="hid" d="M -5.6,32.000 V 63.613 M 5.6,32.000 V 63.613 M -5.6,32.000 H 5.6"/><path class="lead" d="M-11,5 L-30,2"/><text class="call" x="-50.0905" y="6.01429" text-anchor="end">+ shoulder socket</text><path class="lead" d="M0,53 L28,61"/><text class="call" x="29" y="62" text-anchor="start">+ elbow clevis</text><text class="name" x="0" y="113.143" text-anchor="middle">UPPER ARM</text><text class="note" x="0" y="127.176" text-anchor="middle">&#216;24 &#215; 53 mm rod, joint centers 48 mm</text></g></g><g transform="translate(400,22)"><g class="fig" transform="scale(0.498812)"><rect class="part" x="-12" y="0" width="24" height="38"/><path class="part" d="M -12,6 L -12,0 A 12,12 0 0 1 12,0 L 12,6 Z"/><circle class="part" cx="0" cy="0" r="2"/><path class="hid" d="M -12,20 H 12"/><rect class="part" x="-3" y="38" width="6" height="10"/><circle class="part" cx="0" cy="48" r="6"/><path class="lead" d="M0,0 L-28,-6"/><text class="call" x="-46.081" y="-10.0238" text-anchor="end">+ elbow blade</text><path class="lead" d="M0,48 L28,50"/><text class="call" x="29" y="51" text-anchor="start">+ wrist ball stud</text><text class="name" x="0" y="98.1429" text-anchor="middle">FOREARM</text><text class="note" x="0" y="112.176" text-anchor="middle">&#216;24 &#215; 38 mm rod, joint centers 48 mm</text></g></g><g transform="translate(490,30)"><g class="fig" transform="scale(0.498812)"><rect class="part" x="-5" y="0" width="10" height="19"/><path class="part" d="M 3.079,22.939 A 5,5 0 1 1 3.079,15.061 L 1.016,17.700 A 1.65,1.65 0 1 0 1.016,20.300 Z"/><path class="void" d="M -5.76,0 A 6.08,6.08 0 1 0 5.76,0 Z"/><path class="lead" d="M0,1.94648 L-32.0762,-12.0286"/><text class="call" x="-34.081" y="-10.0238" text-anchor="end">+ wrist socket</text><path class="lead" d="M4,17 L18,4"/><text class="call" x="38.0905" y="10.0238" text-anchor="start">clip &#8212; grips &#216;3.2 mm bar</text><path class="lead" d="M5,19 L36.0858,44.1048"/><text class="call" x="38.0905" y="46.1096" text-anchor="start">mouth 2.6 mm, opening forward</text><text class="name" x="0" y="92.2192" text-anchor="middle">GRIPPER</text><text class="note" x="0" y="106.253" text-anchor="middle">24 mm below the wrist &#8212; side view, 18 mm across the bar</text></g></g><g transform="translate(310,160)"><g class="fig" transform="scale(0.498812)"><rect class="part" x="-12" y="0" width="24" height="49.9465"/><path class="void" d="M -5.76,0 A 6.08,6.08 0 1 0 5.76,0 Z"/><path class="part" d="M -12,43.9465 L -12,49.9465 A 12,12 0 0 0 12,49.9465 L 12,43.9465 Z"/><circle class="void" cx="0" cy="49.9465" r="2.2"/><path class="hid" d="M -5.6,28.946 V 60.560 M 5.6,28.946 V 60.560 M -5.6,28.946 H 5.6"/><path class="lead" d="M0,1.94648 L-28,-4"/><text class="call" x="-46.081" y="-6.01429" text-anchor="end">+ hip socket</text><path class="lead" d="M0,49.9465 L28,57.9465"/><text class="call" x="29" y="58.9465" text-anchor="start">+ knee clevis</text><text class="name" x="0" y="110.089" text-anchor="middle">THIGH</text><text class="note" x="0" y="124.123" text-anchor="middle">&#216;24 &#215; 49.95 mm rod, joint centers 48 mm</text></g></g><g transform="translate(400,160)"><g class="fig" transform="scale(0.498812)"><rect class="part" x="-12" y="0" width="24" height="38"/><path class="part" d="M -12,6 L -12,0 A 12,12 0 0 1 12,0 L 12,6 Z"/><circle class="part" cx="0" cy="0" r="2"/><path class="hid" d="M -12,20 H 12"/><rect class="part" x="-3" y="38" width="6" height="10"/><circle class="part" cx="0" cy="48" r="6"/><path class="lead" d="M0,0 L-28,-6"/><text class="call" x="-46.081" y="-10.0238" text-anchor="end">+ knee blade</text><path class="lead" d="M0,48 L28,50"/><text class="call" x="29" y="51" text-anchor="start">+ ankle ball stud</text><text class="name" x="0" y="98.1429" text-anchor="middle">SHIN</text><text class="note" x="0" y="112.176" text-anchor="middle">&#216;24 &#215; 38 mm rod, joint centers 48 mm</text></g></g><g transform="translate(495,180)"><g class="fig" transform="scale(0.498812)"><path class="part" d="M -40,24 h 96 a 10 10 0 0 0 -2 -16 q -28 -8 -92 -8 a 10 10 0 0 0 -2 24 z"/><path class="void" d="M -5.76,0 A 6.08,6.08 0 1 0 5.76,0 Z"/><line class="gnd" x1="-44" y1="24" x2="60" y2="24"/><rect class="void" x="-37" y="22" width="6" height="2"/><rect class="void" x="-25" y="22" width="6" height="2"/><rect class="void" x="-13" y="22" width="6" height="2"/><rect class="void" x="-1" y="22" width="6" height="2"/><rect class="void" x="11" y="22" width="6" height="2"/><rect class="void" x="23" y="22" width="6" height="2"/><rect class="void" x="35" y="22" width="6" height="2"/><rect class="void" x="47" y="22" width="6" height="2"/><path class="lead" d="M0,1.94648 L-36.0858,-12.0286"/><text class="call" x="-38.0905" y="-10.0238" text-anchor="end">+ ankle socket</text><path class="lead" d="M44,16 L68.162,4.00953"/><text class="call" x="70.1668" y="6.01429" text-anchor="start">toe &#8212; the balance</text><path class="lead" d="M-34,24 L-28.0667,52.1239"/><text class="call" x="-30.0715" y="54.1286" text-anchor="end">tread &#8212; 6 mm grooves, 12 mm apart</text><text class="name" x="8" y="60.1429" text-anchor="middle">FOOT</text><text class="note" x="8" y="74.1763" text-anchor="middle">96 &#215; 48 mm</text></g></g><g transform="translate(130,184) scale(1.4964350687551078)" class="det"><g transform="translate(-26.0619,0)"><circle class="part" cx="0" cy="0" r="12"/><circle class="void" cx="0" cy="0" r="6.08"/></g><clipPath id="limbslice"><circle cx="0" cy="0" r="12"/></clipPath><g transform="translate(24.0572,0)"><circle class="ghost" cx="0" cy="0" r="12"/></g><g transform="translate(24.0572,0)" clip-path="url(#limbslice)"><rect class="part" x="-12" y="-12" width="24" height="6.4"/><rect class="part" x="-12" y="5.6" width="24" height="6.4"/><rect class="mate" x="-12" y="-5" width="24" height="10"/></g></g><text class="lbl" x="130" y="140" text-anchor="middle">THE JOINTS AGAINST THE LIMB, TO SCALE</text><text class="note" x="130" y="232" text-anchor="middle">The fork is the whole limb with a slot through it, and the blade is what the slot took out.</text><text class="note" x="130" y="238" text-anchor="middle">The two ears are the springs. The blade is solid, so it gives nothing and the ears give it all.</text><text class="call" x="91" y="214" text-anchor="middle">&#216;24 mm limb, &#216;12.16 mm cavity</text><text class="call" x="91" y="220" text-anchor="middle">leaves 5.92 mm of wall</text><text class="call" x="166" y="214" text-anchor="middle">slot 11.2 mm through a 24 mm limb</text><text class="call" x="166" y="220" text-anchor="middle">ear 6.4 either side, blade 10 between</text><g transform="translate(130,330) scale(1.4964350687551078)" class="det"><path class="mate" d="M -28.0667,1.94648 L -7.35045,1.94648 A 7.60381,7.60381 0 1 1 7.35045,1.94648 L 28.0667,1.94648 L 28.0667,-44.1048 L -28.0667,-44.1048 Z"/><rect class="part" x="-20.0476" y="10" width="40.0953" height="28.0667"/><rect class="part" x="-3" y="0" width="6" height="10"/><circle class="part" cx="0" cy="0" r="6"/></g><text class="lbl" x="130" y="248" text-anchor="middle">BALL AND SOCKET, IN SECTION</text><path class="lead" d="M97,279 L80,276"/><text class="call" x="78" y="277" text-anchor="end">socket &#8212; the outboard part</text><path class="lead" d="M122.8,324.3 L80,304"/><text class="call" x="78" y="305" text-anchor="end">cavity &#216;12.16 mm</text><text class="call" x="78" y="312" text-anchor="end">= ball + 2 &#215; fit</text><path class="lead" d="M119.001,332.913 L80,340"/><text class="call" x="78" y="341" text-anchor="end">grip 1.95 mm &#8212; sets the mouth</text><path class="lead" d="M140.999,332.913 L180,310"/><text class="call" x="182" y="311" text-anchor="start">mouth &#216;11.52 mm &#8212; 96% of the ball</text><path class="lead" d="M138.7,331.2 L180,334"/><text class="call" x="182" y="335" text-anchor="start">ball &#216;12 mm</text><path class="lead" d="M134.5,341.4 L180,354"/><text class="call" x="182" y="355" text-anchor="start">stalk &#216;6 mm</text><path class="lead" d="M154,366 L180,376"/><text class="call" x="182" y="377" text-anchor="start">ball stud &#8212; the inboard part</text><text class="note" x="130" y="406" text-anchor="middle">The ball stud goes on the part nearer the torso, the socket on the part further out. Always.</text><text class="note" x="130" y="412" text-anchor="middle">Clearance drawn oversize to be visible; every number here is the real one.</text><g transform="translate(420,330) scale(1.4964350687551078)" class="det"><g transform="translate(-22.0524,0)"><path class="part" d="M -5.600,-33 L -12.000,-33 L -12.000,0 A 12,12 0 0 0 -5.600,10.613 Z"/><path class="part" d="M 5.600,-33 L 12.000,-33 L 12.000,0 A 12,12 0 0 1 5.600,10.613 Z"/><path class="mate" d="M -5,20 L -5,-10.909 A 12,12 0 0 1 5,-10.909 L 5,20 Z"/><rect class="void" x="-12" y="-2.2" width="6.4" height="4.4"/><rect class="void" x="5.6" y="-2.2" width="6.4" height="4.4"/><rect class="mate" x="-6.6" y="-2" width="1.6" height="4"/><rect class="mate" x="5" y="-2" width="1.6" height="4"/></g><g transform="translate(28.0667,0)"><circle class="part" cx="0" cy="0" r="10.9087"/><circle class="hid" cx="0" cy="0" r="8.8"/><circle class="hid" cx="0" cy="0" r="10.4"/><circle class="mate" cx="9.6" cy="0" r="0.8"/><circle class="mate" cx="9.27289" cy="2.48466" r="0.8"/><circle class="mate" cx="8.31384" cy="4.8" r="0.8"/><circle class="mate" cx="6.78823" cy="6.78823" r="0.8"/><circle class="mate" cx="4.8" cy="8.31384" r="0.8"/><circle class="mate" cx="2.48466" cy="9.27289" r="0.8"/><circle class="mate" cx="5.8783e-16" cy="9.6" r="0.8"/><circle class="mate" cx="-2.48466" cy="9.27289" r="0.8"/><circle class="mate" cx="-4.8" cy="8.31384" r="0.8"/><circle class="mate" cx="-6.78823" cy="6.78823" r="0.8"/><circle class="mate" cx="-8.31384" cy="4.8" r="0.8"/><circle class="mate" cx="-9.27289" cy="2.48466" r="0.8"/><circle class="mate" cx="-9.6" cy="1.17566e-15" r="0.8"/><circle class="mate" cx="-9.27289" cy="-2.48466" r="0.8"/><circle class="mate" cx="-8.31384" cy="-4.8" r="0.8"/><circle class="mate" cx="-6.78823" cy="-6.78823" r="0.8"/><circle class="mate" cx="-4.8" cy="-8.31384" r="0.8"/><circle class="mate" cx="-2.48466" cy="-9.27289" r="0.8"/><circle class="mate" cx="-1.76349e-15" cy="-9.6" r="0.8"/><circle class="mate" cx="2.48466" cy="-9.27289" r="0.8"/><circle class="mate" cx="4.8" cy="-8.31384" r="0.8"/><circle class="mate" cx="6.78823" cy="-6.78823" r="0.8"/><circle class="mate" cx="8.31384" cy="-4.8" r="0.8"/><circle class="mate" cx="9.27289" cy="-2.48466" r="0.8"/><circle class="void" cx="0" cy="0" r="2.2"/></g></g><text class="lbl" x="420" y="248" text-anchor="middle">HINGE &#8212; PRESS FIT, WITH DETENTS</text><text class="call" x="387" y="264" text-anchor="middle">ALONG THE LIMB</text><text class="call" x="462" y="264" text-anchor="middle">ONE TOOTHED FACE</text><path class="lead" d="M373.831,291 L354,286"/><text class="call" x="352" y="287" text-anchor="end">clevis &#8212; two ears</text><path class="lead" d="M378.321,330 L354,306"/><text class="call" x="352" y="307" text-anchor="end">axle &#216;4 mm across the blade</text><path class="lead" d="M373.831,333.292 L354,326"/><text class="call" x="352" y="327" text-anchor="end">bore &#216;4.4 mm through each ear</text><path class="lead" d="M390.741,356.929 L354,346"/><text class="call" x="352" y="347" text-anchor="end">blade &#8212; the tongue between them, solid</text><path class="lead" d="M472.17,319.83 L474,304"/><text class="call" x="476" y="305" text-anchor="start">bump &#216;1.6 mm, 15&#176; apart</text><path class="lead" d="M465.3,335.7 L474,338"/><text class="call" x="476" y="339" text-anchor="start">axle bore &#216;4.4 mm</text><text class="note" x="420" y="404" text-anchor="middle">Elbows and knees. Push the blade in &#8212; the ears spread and the axle snaps</text><text class="note" x="420" y="410" text-anchor="middle">into the bores. The ears then squeeze the toothed faces together, so the joint holds its angle.</text><text class="note" x="420" y="416" text-anchor="middle">The blade is solid, so the ears are the whole spring: each gives the 1.0 mm the axle needs, at 51.3 MPa on paper against PETG&#8217;s 50</text><text class="note" x="420" y="422" text-anchor="middle">&#8212; a cantilever estimate the printed joints beat. No pin &#8212; the LEGO bar is only in the gripper.</text><text class="lbl" x="-60" y="-36" text-anchor="start">SHEET 2 &#8212; THE UNIQUE PARTS</text><text class="note" x="-60" y="-28" text-anchor="start">One of each goes in the Part Studio; the assembly makes the copies.</text><text class="note" x="-60" y="-21" text-anchor="start">A + marks a joint part: modeled on its own, then added to the part it sits on. A socket is added too, even though it cuts material away.</text><text class="note" x="-60" y="442" text-anchor="start">Every ball stud stands off its face on a stalk, as drawn here. On sheet 1 the joint centers sit on their station lines instead &#8212; that is the kinematic view.</text><text class="note" x="-60" y="449" text-anchor="start">Where the two sheets disagree, this one is the one to build from.</text><text class="note" x="-60" y="460" text-anchor="start">The hip stud stands off the torso&#8217;s bottom face like every other, and the leg drops the 10 mm with it. A recess into the torso was considered and dropped: it buys no swing, because the 41.76&#176; limit is set inside the socket, by the stalk meeting the mouth.</text><text class="note" x="-60" y="471" text-anchor="start">The shoulder is the exception. Its stud runs 26 mm from the side face, of which only the last 10 is &#216;6; the rest is a &#216;16 boss on the same axis, cut off flush where it crosses the top face. Coaxial is what makes the boss free: it sits behind the ball, and the socket only reaches forward of it.</text><text class="note" x="-60" y="482" text-anchor="start">The hinge divides the same &#216;24 three ways: ear 6.4, blade 10, ear 6.4, with a 0.6 clearance either side of the blade. The blade is solid, so the ears carry the fit on their own: each bends the 1.0 mm the axle</text><text class="note" x="-60" y="493" text-anchor="start">needs, where a slit up the blade used to give half of it. On paper that is 51.3 MPa against PETG&#8217;s 50; in PETG the joints printed without the slit hold and release, so the cantilever is the pessimist. A joint is only as strong as where the load crosses it.</text></svg>