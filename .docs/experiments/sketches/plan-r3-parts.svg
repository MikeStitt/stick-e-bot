  .stn   { stroke:#0b6e86; stroke-width:0.25; stroke-dasharray:3 2; }
  .gnd   { stroke:#0b6e86; stroke-width:0.8; }
  .tooth { stroke:#1d262e; stroke-width:0.5; fill:none; }
  .det * { vector-effect: non-scaling-stroke; }
</style><g transform="translate(60,60)"><clipPath id="shp0"><rect x="-400" y="-24" width="800" height="800"/></clipPath><g clip-path="url(#shp0)"><path class="part" d="M -18.000,-27.319 L -25.519,-15.797 L -18.820,-11.425 L -18.000,-12.681 Z"/><rect class="part" x="-1.5" y="0" width="3" height="4.76827" transform="translate(-22.1695,-13.6109) rotate(33.1283)"/></g><clipPath id="shp1"><rect x="-400" y="-24" width="800" height="800"/></clipPath><g clip-path="url(#shp1)"><path class="part" d="M 18.000,-27.319 L 25.519,-15.797 L 18.820,-11.425 L 18.000,-12.681 Z"/><rect class="part" x="-1.5" y="0" width="3" height="4.76827" transform="translate(22.1695,-13.6109) rotate(-33.1283)"/></g><rect class="part" x="-18" y="-24" width="36" height="48"/><circle class="part" cx="-24.7754" cy="-9.61774" r="3"/><circle class="part" cx="24.7754" cy="-9.61774" r="3"/><rect class="part" x="-1.5" y="-29" width="3" height="5"/><circle class="part" cx="0" cy="-29" r="3"/><rect class="part" x="-13.5" y="24" width="3" height="5"/><circle class="part" cx="-12" cy="29" r="3"/><rect class="part" x="10.5" y="24" width="3" height="5"/><circle class="part" cx="12" cy="29" r="3"/><line class="ctr" x1="0" y1="-38" x2="0" y2="38"/><path class="lead" d="M-2.6,-30.5 L-14,-37"/><text class="call" x="-15" y="-36" text-anchor="end">+ neck ball stud</text><path class="lead" d="M27.7754,-9.61774 L34,-20"/><text class="call" x="35" y="-19" text-anchor="start">+ shoulder ball stud</text><text class="call" x="35" y="-14" text-anchor="start">53&#176; down, 30&#176; forward</text><path class="lead" d="M21,-21 L34,-10"/><text class="call" x="35" y="-9" text-anchor="start">&#216;8 boss on the same axis,</text><text class="call" x="35" y="-4" text-anchor="start">cut flush at the top face</text><path class="lead" d="M12,32 L12,37 L26,37"/><text class="call" x="27" y="38" text-anchor="start">+ hip ball stud</text><text class="name" x="0" y="48" text-anchor="middle">TORSO</text><text class="note" x="0" y="55" text-anchor="middle">36 &#215; 48 &#215; 24 mm</text></g><g transform="translate(185,52)"><rect class="part" x="-18" y="-18" width="36" height="36"/><circle class="part" cx="-8" cy="-8" r="5"/><circle class="part" cx="8" cy="-8" r="5"/><circle class="part" cx="-8" cy="-8" r="2"/><circle class="part" cx="8" cy="-8" r="2"/><rect class="part" x="-10" y="6.5" width="20" height="5" rx="2.5"/><rect class="part" x="-4.7" y="18" width="9.4" height="5.5"/><path class="void" d="M -2.90129,23.5 A 3.2,3.2 0 1 1 2.90129,23.5 Z"/><path class="hid" d="M -0.4,18 V 23.5 M 0.4,18 V 23.5"/><path class="lead" d="M4.7,20.75 L16,22"/><text class="call" x="17" y="23" text-anchor="start">+ neck socket, collar &#216;9.4</text><text class="call" x="17" y="28" text-anchor="start">5.5 mm proud, four 0.8 slits</text><path class="lead" d="M8,-8 L20,-20"/><text class="call" x="21" y="-20" text-anchor="start">eye and pupil</text><path class="lead" d="M6,9 L20,16"/><text class="call" x="21" y="17" text-anchor="start">mouth &#8212; slot</text><text class="name" x="0" y="35.5" text-anchor="middle">HEAD</text><text class="note" x="0" y="42.5" text-anchor="middle">36 &#215; 36 &#215; 30 mm</text></g><g transform="translate(310,22)"><rect class="part" x="-6" y="0" width="12" height="24"/><path class="void" d="M -6,2.09871 A 3.2,3.2 0 1 0 -6,7.90129 Z"/><path class="part" d="M -6,18 L -6,24 A 6,6 0 0 0 6,24 L 6,18 Z"/><circle class="hid" cx="0" cy="24" r="1"/><path class="hid" d="M -2.8,13.000 V 29.307 M 2.8,13.000 V 29.307 M -2.8,13.000 H 2.8"/><path class="lead" d="M-5,5 L-24,2"/><text class="call" x="-25" y="3" text-anchor="end">+ shoulder socket</text><path class="lead" d="M0,24 L22,32"/><text class="call" x="23" y="33" text-anchor="start">+ elbow clevis</text><text class="name" x="0" y="54" text-anchor="middle">UPPER ARM</text><text class="note" x="0" y="61" text-anchor="middle">&#216;12 &#215; 24 mm</text></g><g transform="translate(400,22)"><rect class="part" x="-6" y="0" width="12" height="24"/><path class="part" d="M -6,6 L -6,0 A 6,6 0 0 1 6,0 L 6,6 Z"/><circle class="void" cx="0" cy="0" r="1.1"/><path class="hid" d="M -0.4,10 V -5.987 M 0.4,10 V -5.987"/><path class="hid" d="M -6,10 H 6"/><rect class="part" x="-1.5" y="24" width="3" height="5"/><circle class="part" cx="0" cy="29" r="3"/><path class="lead" d="M0,0 L-22,-6"/><text class="call" x="-23" y="-5" text-anchor="end">+ elbow blade</text><path class="lead" d="M0,29 L22,36"/><text class="call" x="23" y="37" text-anchor="start">+ wrist ball stud</text><text class="name" x="0" y="54" text-anchor="middle">FOREARM</text><text class="note" x="0" y="61" text-anchor="middle">&#216;12 &#215; 24 mm</text></g><g transform="translate(490,30)"><rect class="part" x="-3" y="0" width="6" height="7"/><path class="part" d="M -3.214,10.830 A 5.0,5.0 0 1 1 3.214,10.830 L 1.028,8.226 A 1.6,1.6 0 1 0 -1.028,8.226 Z"/><path class="void" d="M -2.90129,0 A 3.2,3.2 0 1 0 2.90129,0 Z"/><path class="lead" d="M0,1.35 L-16,-6"/><text class="call" x="-17" y="-5" text-anchor="end">+ wrist socket</text><path class="lead" d="M4,5 L18,4"/><text class="call" x="19" y="5" text-anchor="start">clip &#8212; grips &#216;3.2 mm bar</text><path class="lead" d="M0,12 L18,22"/><text class="call" x="19" y="23" text-anchor="start">mouth on the centerline</text><text class="name" x="0" y="46" text-anchor="middle">GRIPPER</text><text class="note" x="0" y="53" text-anchor="middle">12 mm below the wrist</text></g><g transform="translate(310,160)"><rect class="part" x="-6" y="0" width="12" height="24"/><path class="void" d="M -2.90129,0 A 3.2,3.2 0 1 0 2.90129,0 Z"/><path class="part" d="M -6,18 L -6,24 A 6,6 0 0 0 6,24 L 6,18 Z"/><circle class="hid" cx="0" cy="24" r="1"/><path class="hid" d="M -2.8,13.000 V 29.307 M 2.8,13.000 V 29.307 M -2.8,13.000 H 2.8"/><path class="lead" d="M0,1.35 L-22,-4"/><text class="call" x="-23" y="-3" text-anchor="end">+ hip socket</text><path class="lead" d="M0,24 L22,32"/><text class="call" x="23" y="33" text-anchor="start">+ knee clevis</text><text class="name" x="0" y="54" text-anchor="middle">THIGH</text><text class="note" x="0" y="61" text-anchor="middle">&#216;12 &#215; 24 mm</text></g><g transform="translate(400,160)"><rect class="part" x="-6" y="0" width="12" height="24"/><path class="part" d="M -6,6 L -6,0 A 6,6 0 0 1 6,0 L 6,6 Z"/><circle class="void" cx="0" cy="0" r="1.1"/><path class="hid" d="M -0.4,10 V -5.987 M 0.4,10 V -5.987"/><path class="hid" d="M -6,10 H 6"/><rect class="part" x="-1.5" y="24" width="3" height="5"/><circle class="part" cx="0" cy="29" r="3"/><path class="lead" d="M0,0 L-22,-6"/><text class="call" x="-23" y="-5" text-anchor="end">+ knee blade</text><path class="lead" d="M0,29 L22,36"/><text class="call" x="23" y="37" text-anchor="start">+ ankle ball stud</text><text class="name" x="0" y="54" text-anchor="middle">SHIN</text><text class="note" x="0" y="61" text-anchor="middle">&#216;12 &#215; 24 mm</text></g><g transform="translate(495,180)"><path class="part" d="M -20,12 h 48 a 5 5 0 0 0 -1 -8 q -14 -4 -46 -4 a 5 5 0 0 0 -1 12 z"/><path class="void" d="M -2.90129,0 A 3.2,3.2 0 1 0 2.90129,0 Z"/><line class="gnd" x1="-22" y1="12" x2="30" y2="12"/><path class="lead" d="M0,1.35 L-18,-6"/><text class="call" x="-19" y="-5" text-anchor="end">+ ankle socket</text><path class="lead" d="M22,8 L34,2"/><text class="call" x="35" y="3" text-anchor="start">toe &#8212; the balance</text><text class="name" x="4" y="30" text-anchor="middle">FOOT</text><text class="note" x="4" y="37" text-anchor="middle">48 &#215; 24 mm</text></g><g transform="translate(130,184) scale(3.0)" class="det"><g transform="translate(-13,0)"><circle class="part" cx="0" cy="0" r="6"/><circle class="void" cx="0" cy="0" r="3.2"/></g><clipPath id="limbslice"><circle cx="0" cy="0" r="6"/></clipPath><g transform="translate(12,0)"><circle class="ghost" cx="0" cy="0" r="6"/></g><g transform="translate(12,0)" clip-path="url(#limbslice)"><rect class="part" x="-6" y="-6" width="12" height="3.2"/><rect class="part" x="-6" y="2.8" width="12" height="3.2"/><rect class="mate" x="-6" y="-2.5" width="12" height="5"/><rect class="void" x="-6" y="-0.4" width="12" height="0.8"/></g></g><text class="lbl" x="130" y="140" text-anchor="middle">THE JOINTS AGAINST THE LIMB, TO SCALE</text><text class="note" x="130" y="232" text-anchor="middle">The fork is the whole limb with a slot through it, and the blade is what the slot took out.</text><text class="note" x="130" y="238" text-anchor="middle">Four walls, all of them springs: two ears, and the two halves the slit leaves of the blade.</text><text class="call" x="91" y="214" text-anchor="middle">&#216;12 mm limb, &#216;6.4 mm cavity</text><text class="call" x="91" y="220" text-anchor="middle">leaves 2.8 mm of wall</text><text class="call" x="166" y="214" text-anchor="middle">slot 5.6 mm through a 12 mm limb</text><text class="call" x="166" y="220" text-anchor="middle">ear 3.2, tab 2.1, either side of a 0.8 slit</text><g transform="translate(130,330) scale(3.0)" class="det"><path class="mate" d="M -14,1.35 L -3.55211,1.35 A 3.8,3.8 0 1 1 3.55211,1.35 L 14,1.35 L 14,-22 L -14,-22 Z"/><rect class="part" x="-10" y="5" width="20" height="14"/><rect class="part" x="-1.5" y="0" width="3" height="5"/><circle class="part" cx="0" cy="0" r="3"/></g><text class="lbl" x="130" y="248" text-anchor="middle">BALL AND SOCKET, IN SECTION</text><path class="lead" d="M97,279 L80,276"/><text class="call" x="78" y="277" text-anchor="end">socket &#8212; the outboard part</text><path class="lead" d="M122.8,324.3 L80,304"/><text class="call" x="78" y="305" text-anchor="end">cavity &#216;6.4 mm</text><text class="call" x="78" y="312" text-anchor="end">= ball + 2 &#215; fit</text><path class="lead" d="M119.344,334.05 L80,340"/><text class="call" x="78" y="341" text-anchor="end">grip 1.35 mm &#8212; sets the mouth</text><path class="lead" d="M140.656,334.05 L180,310"/><text class="call" x="182" y="311" text-anchor="start">mouth &#216;5.803 mm &#8212; 97% of the ball</text><path class="lead" d="M138.7,331.2 L180,334"/><text class="call" x="182" y="335" text-anchor="start">ball &#216;6 mm</text><path class="lead" d="M134.5,341.4 L180,354"/><text class="call" x="182" y="355" text-anchor="start">stalk &#216;3 mm</text><path class="lead" d="M154,366 L180,376"/><text class="call" x="182" y="377" text-anchor="start">ball stud &#8212; the inboard part</text><text class="note" x="130" y="406" text-anchor="middle">The ball stud goes on the part nearer the torso, the socket on the part further out. Always.</text><text class="note" x="130" y="412" text-anchor="middle">Clearance drawn oversize to be visible; every number here is the real one.</text><g transform="translate(420,330) scale(3.0)" class="det"><g transform="translate(-11,0)"><path class="part" d="M -2.800,-17 L -6.000,-17 L -6.000,0 A 6,6 0 0 0 -2.800,5.307 Z"/><path class="part" d="M 2.800,-17 L 6.000,-17 L 6.000,0 A 6,6 0 0 1 2.800,5.307 Z"/><path class="mate" d="M -2.5,10 L -2.5,-5.454 A 6,6 0 0 1 2.5,-5.454 L 2.5,10 Z"/><rect class="void" x="-0.4" y="-6" width="0.8" height="16"/><rect class="part" x="-2.8" y="-1" width="0.8" height="2"/><rect class="part" x="2" y="-1" width="0.8" height="2"/><rect class="void" x="-2.5" y="-1.1" width="1" height="2.2"/><rect class="void" x="1.5" y="-1.1" width="1" height="2.2"/></g><g transform="translate(14,0)"><circle class="part" cx="0" cy="0" r="5.45436"/><circle class="hid" cx="0" cy="0" r="4.4"/><circle class="hid" cx="0" cy="0" r="5.2"/><circle class="mate" cx="4.8" cy="0" r="0.4"/><circle class="mate" cx="4.63644" cy="1.24233" r="0.4"/><circle class="mate" cx="4.15692" cy="2.4" r="0.4"/><circle class="mate" cx="3.39411" cy="3.39411" r="0.4"/><circle class="mate" cx="2.4" cy="4.15692" r="0.4"/><circle class="mate" cx="1.24233" cy="4.63644" r="0.4"/><circle class="mate" cx="2.93915e-16" cy="4.8" r="0.4"/><circle class="mate" cx="-1.24233" cy="4.63644" r="0.4"/><circle class="mate" cx="-2.4" cy="4.15692" r="0.4"/><circle class="mate" cx="-3.39411" cy="3.39411" r="0.4"/><circle class="mate" cx="-4.15692" cy="2.4" r="0.4"/><circle class="mate" cx="-4.63644" cy="1.24233" r="0.4"/><circle class="mate" cx="-4.8" cy="5.8783e-16" r="0.4"/><circle class="mate" cx="-4.63644" cy="-1.24233" r="0.4"/><circle class="mate" cx="-4.15692" cy="-2.4" r="0.4"/><circle class="mate" cx="-3.39411" cy="-3.39411" r="0.4"/><circle class="mate" cx="-2.4" cy="-4.15692" r="0.4"/><circle class="mate" cx="-1.24233" cy="-4.63644" r="0.4"/><circle class="mate" cx="-8.81746e-16" cy="-4.8" r="0.4"/><circle class="mate" cx="1.24233" cy="-4.63644" r="0.4"/><circle class="mate" cx="2.4" cy="-4.15692" r="0.4"/><circle class="mate" cx="3.39411" cy="-3.39411" r="0.4"/><circle class="mate" cx="4.15692" cy="-2.4" r="0.4"/><circle class="mate" cx="4.63644" cy="-1.24233" r="0.4"/><circle class="void" cx="0" cy="0" r="1.1"/><rect class="void" x="-0.4" y="-5.45436" width="0.8" height="10.9087"/></g></g><text class="lbl" x="420" y="248" text-anchor="middle">HINGE &#8212; PRESS FIT, WITH DETENTS</text><text class="call" x="387" y="264" text-anchor="middle">ALONG THE LIMB</text><text class="call" x="462" y="264" text-anchor="middle">ONE TOOTHED FACE</text><path class="lead" d="M373.8,291 L354,286"/><text class="call" x="352" y="287" text-anchor="end">clevis &#8212; two ears</text><path class="lead" d="M379.8,330 L354,306"/><text class="call" x="352" y="307" text-anchor="end">stub &#216;2.0 mm on each ear</text><path class="lead" d="M381,334.8 L354,326"/><text class="call" x="352" y="327" text-anchor="end">pocket &#216;2.2 mm in the blade</text><path class="lead" d="M387,345 L354,346"/><text class="call" x="352" y="347" text-anchor="end">slit 0.8 mm, the blade&#8217;s whole 16 mm</text><path class="lead" d="M390.75,357 L354,366"/><text class="call" x="352" y="367" text-anchor="end">blade &#8212; the tongue between them</text><path class="lead" d="M472.17,319.83 L474,304"/><text class="call" x="476" y="305" text-anchor="start">bump &#216;0.8 mm, 15&#176; apart</text><path class="lead" d="M465.3,335.7 L474,338"/><text class="call" x="476" y="339" text-anchor="start">stub bore &#216;2 mm</text><text class="note" x="420" y="404" text-anchor="middle">Elbows and knees. Push the blade in &#8212; the ears spread, the slit closes, and the stubs snap</text><text class="note" x="420" y="410" text-anchor="middle">into the pockets. The ears then squeeze the toothed faces together, so the joint holds its angle.</text><text class="note" x="420" y="416" text-anchor="middle">Ear and blade are springs in series, matched so both give: 0.2 and 0.3 mm of the 0.5, at 19.05 and 18.95 MPa</text><text class="note" x="420" y="422" text-anchor="middle">against PETG&#8217;s 50, and about 3.22 kgf to press together. No pin &#8212; the LEGO bar is only in the gripper.</text><text class="lbl" x="-60" y="-36" text-anchor="start">SHEET 2 &#8212; THE UNIQUE PARTS</text><text class="note" x="-60" y="-28" text-anchor="start">One of each goes in the Part Studio; the assembly makes the copies.</text><text class="note" x="-60" y="-21" text-anchor="start">A + marks a joint part: modeled on its own, then added to the part it sits on. A socket is added too, even though it cuts material away.</text><text class="note" x="-60" y="442" text-anchor="start">Every ball stud stands off its face on a stalk, as drawn here. On sheet 1 the joint centers sit on their station lines instead &#8212; that is the kinematic view.</text><text class="note" x="-60" y="449" text-anchor="start">Where the two sheets disagree, this one is the one to build from.</text><text class="note" x="-60" y="460" text-anchor="start">The hip stud stands off the torso&#8217;s bottom face like every other, and the leg drops the 5 mm with it. A recess into the torso was considered and dropped: it buys no swing, because the 37.09&#176; limit is set inside the socket, by the stalk meeting the mouth.</text><text class="note" x="-60" y="471" text-anchor="start">The shoulder is the exception. Its stud runs 13 mm from the side face, of which only the last 5 is &#216;3; the rest is a &#216;8 boss on the same axis, cut off flush where it crosses the top face. Coaxial is what makes the boss free: it sits behind the ball, and the socket only reaches forward of it.</text><text class="note" x="-60" y="482" text-anchor="start">The hinge divides the same &#216;12 four ways: ear 3.2, tab 2.1, tab 2.1, ear 3.2, with two 0.3 clearances and a 0.8 slit between them. Ear and tab are springs in series, so the stiffer of the two does nothing unless they are</text><text class="note" x="-60" y="493" text-anchor="start">matched. Matched on section modulus over free length, they share the 0.5 the stub needs &#8212; 0.2 in the ears, 0.3 in the blade &#8212; and reach 19.05 and 18.95 MPa together. A joint is only as strong as where the load crosses it.</text></svg>