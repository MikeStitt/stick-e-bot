"58" y2="51.6166"/><text class="call" x="-60" y="52.8166" text-anchor="end">shoulder 197.24 mm</text><line class="stn" x1="-58" y1="32.2804" x2="58" y2="32.2804"/><text class="call" x="-60" y="33.4804" text-anchor="end">neck 236 mm</text><line class="stn" x1="-58" y1="9.80722" x2="58" y2="9.80722"/><text class="call" x="-60" y="11.0072" text-anchor="end">head center 281.05 mm</text><g class="dim"><path d="M -70 -8.15 H -78 M -70 150 H -78"/><path d="M -75 -8.15 V 150"/><path d="M -75 -8.15 l -1.4 4 h 2.8 z" fill="#b8156e"/><path d="M -75 150 l -1.4 -4 h 2.8 z" fill="#b8156e"/></g><text class="dimt" x="-79" y="70.925" text-anchor="middle" transform="rotate(-90 -79 70.925)">317.05 mm</text><path class="lead" d="M0,3.80722 L62,-6.15"/><text class="call" x="64" y="-4.95" text-anchor="start">head</text><path class="lead" d="M0,32.2804 L62,32.2804"/><text class="call" x="64" y="33.4804" text-anchor="start">neck ball joint</text><path class="lead" d="M7,45.2686 L62,41.2686"/><text class="call" x="64" y="42.4686" text-anchor="start">torso</text><path class="lead" d="M27.7166,60.6166 L62,57.6166"/><text class="call" x="64" y="58.8166" text-anchor="start">upper arm</text><path class="lead" d="M2.4,61.2115 L62,64.1166"/><text class="call" x="64" y="65.3166" text-anchor="start">origin &#8212; center of the torso</text><path class="lead" d="M39.8018,81.6676 L62,81.6676"/><text class="call" x="64" y="82.8676" text-anchor="start">forearm</text><path class="lead" d="M36.8762,102.098 L62,99.0985"/><text class="call" x="64" y="100.298" text-anchor="start">gripper</text><path class="lead" d="M17.9572,110.143 L62,110.143"/><text class="call" x="64" y="111.343" text-anchor="start">thigh</text><path class="lead" d="M11.9715,126.086 L62,126.086"/><text class="call" x="64" y="127.286" text-anchor="start">shin</text><path class="lead" d="M10,144.029 L62,142.029"/><text class="call" x="64" y="143.229" text-anchor="start">foot</text></g><g transform="translate(196,0)"><g class="fig" transform="scale(0.498812)"><rect class="part" x="-24" y="74.7147" width="48" height="96"/><rect class="part" x="-3" y="62.7147" width="6" height="12"/><circle class="part" cx="0" cy="64.7147" r="6"/><rect class="part" x="-9" y="55.6612" width="18" height="11"/><rect class="part" x="-30" y="-16.3388" width="60" height="72"/><rect class="part" x="-12" y="180.715" width="24" height="48"/><rect class="part" x="-12" y="228.715" width="24" height="48"/><path class="part" d="M -40,300.715 h 96 a 10 10 0 0 0 -2 -16 q -28 -8 -92 -8 a 10 10 0 0 0 -2 24 z"/><rect class="part" x="-4.1764" y="170.715" width="24" height="43.422"/><rect class="hid" x="-4.1764" y="103.479" width="24" height="67.2355"/><line class="ctr" x1="0" y1="-22.3388" x2="0" y2="306.715"/></g><line class="gnd" x1="-26" y1="150" x2="34" y2="150"/><g class="dim"><path d="M -12 85.1545 V 90.1545 M 12 85.1545 V 90.1545"/><path d="M -12 88.6545 H 12"/><path d="M -12 88.6545 l 4 -1.4 v 2.8 z" fill="#b8156e"/><path d="M 12 88.6545 l -4 -1.4 v 2.8 z" fill="#b8156e"/></g><text class="dimt" x="-14" y="87.6545" text-anchor="end">48 mm</text><path class="lead" d="M3.9025,98.8139 L26,102.814"/><text class="call" x="27" y="103.814" text-anchor="start">both arms, edge-on</text><text class="note" x="4" y="168" text-anchor="middle">The arms lie in one plane 7.82 mm forward of center,</text><text class="note" x="4" y="174" text-anchor="middle">so this view sees them edge-on and both at once. Dashed</text><text class="note" x="4" y="180" text-anchor="middle">where the torso is in front of them.</text></g><text class="lbl" x="0" y="-10" text-anchor="middle">FRONT</text><text class="lbl" x="196" y="-10" text-anchor="middle">SIDE</text><text class="lbl" x="-86" y="-52" text-anchor="start">SHEET 1 &#8212; ASSEMBLED</text><text class="note" x="-86" y="-44" text-anchor="start">The parts from sheet 2, assembled. Joint centers sit on their station lines, and every station is derived &#8212; nothing is fitted to a round height.</text><text class="note" x="-86" y="-38" text-anchor="start">Shoulder stud 53&#176; down and 30&#176; forward, 26 mm long: a &#216;16 boss coaxial with the last 10 mm of &#216;6 stalk, cut flush at the torso's top face.</text><text class="note" x="-86" y="-32" text-anchor="start">That puts the ball 13.55 mm clear of the side, so a &#216;24 arm swings anywhere the socket allows &#8212; -5.41&#176; to 71.67&#176; from vertical.</text><text class="note" x="-86" y="-26" text-anchor="start">The arm is drawn at 33.13&#176;, hanging 17.51&#176; off the stud. All of that is fore-and-aft, so it stays in one plane and this view reads true length.</text><text class="note" x="-86" y="-20" text-anchor="start">Elbows bent 45&#176; for the picture; the assembly is saved at rest. The gripper's bore runs left-right, so it is two hidden lines here and a circle on the parts sheet.</text><text class="note" x="-86" y="198" text-anchor="start">Session 1 builds the neck as a plain &#216;24 mm post. It becomes the ball joint shown here once joints are taught.</text></svg>