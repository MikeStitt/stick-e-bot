"note" x="0" y="49" text-anchor="middle">36 &#215; 36 &#215; 30 mm</text></g><g transform="translate(310,22)"><rect class="part" x="-6" y="0" width="12" height="24"/><path class="void" d="M -6,2.09871 A 3.2,3.2 0 1 0 -6,7.90129 Z"/><path class="part" d="M -6,18 L -6,24 A 6,6 0 0 0 6,24 L 6,18 Z"/><circle class="void" cx="0" cy="24" r="1.675"/><path class="hid" d="M -3,18 V 26 M 3,18 V 26"/><path class="lead" d="M-5,5 L-24,2"/><text class="call" x="-25" y="3" text-anchor="end">+ shoulder socket</text><path class="lead" d="M0,24 L22,32"/><text class="call" x="23" y="33" text-anchor="start">+ elbow clevis</text><text class="name" x="0" y="54" text-anchor="middle">UPPER ARM</text><text class="note" x="0" y="61" text-anchor="middle">&#216;12 &#215; 24 mm</text></g><g transform="translate(400,22)"><rect class="part" x="-6" y="0" width="12" height="24"/><path class="part" d="M -6,6 L -6,0 A 6,6 0 0 1 6,0 L 6,6 Z"/><circle class="void" cx="0" cy="0" r="1.55"/><rect class="part" x="-1.5" y="24" width="3" height="5"/><circle class="part" cx="0" cy="29" r="3"/><path class="lead" d="M0,0 L-22,-6"/><text class="call" x="-23" y="-5" text-anchor="end">+ elbow blade</text><path class="lead" d="M0,29 L22,36"/><text class="call" x="23" y="37" text-anchor="start">+ wrist ball stud</text><text class="name" x="0" y="54" text-anchor="middle">FOREARM</text><text class="note" x="0" y="61" text-anchor="middle">&#216;12 &#215; 24 mm</text></g><g transform="translate(490,30)"><rect class="part" x="-3" y="0" width="6" height="7"/><path class="part" d="M -3.214,10.830 A 5.0,5.0 0 1 1 3.214,10.830 L 1.028,8.226 A 1.6,1.6 0 1 0 -1.028,8.226 Z"/><path class="void" d="M -2.90129,0 A 3.2,3.2 0 1 0 2.90129,0 Z"/><path class="lead" d="M0,1.35 L-16,-6"/><text class="call" x="-17" y="-5" text-anchor="end">+ wrist socket</text><path class="lead" d="M4,5 L18,4"/><text class="call" x="19" y="5" text-anchor="start">clip &#8212; grips &#216;3.2 mm bar</text><path class="lead" d="M0,12 L18,22"/><text class="call" x="19" y="23" text-anchor="start">mouth on the centerline</text><text class="name" x="0" y="46" text-anchor="middle">GRIPPER</text><text class="note" x="0" y="53" text-anchor="middle">12 mm below the wrist</text></g><g transform="translate(310,160)"><rect class="part" x="-6" y="0" width="12" height="24"/><path class="void" d="M -2.90129,0 A 3.2,3.2 0 1 0 2.90129,0 Z"/><path class="part" d="M -6,18 L -6,24 A 6,6 0 0 0 6,24 L 6,18 Z"/><circle class="void" cx="0" cy="24" r="1.675"/><path class="hid" d="M -3,18 V 26 M 3,18 V 26"/><path class="lead" d="M0,1.35 L-22,-4"/><text class="call" x="-23" y="-3" text-anchor="end">+ hip socket</text><path class="lead" d="M0,24 L22,32"/><text class="call" x="23" y="33" text-anchor="start">+ knee clevis</text><text class="name" x="0" y="54" text-anchor="middle">THIGH</text><text class="note" x="0" y="61" text-anchor="middle">&#216;12 &#215; 24 mm</text></g><g transform="translate(400,160)"><rect class="part" x="-6" y="0" width="12" height="24"/><path class="part" d="M -6,6 L -6,0 A 6,6 0 0 1 6,0 L 6,6 Z"/><circle class="void" cx="0" cy="0" r="1.55"/><rect class="part" x="-1.5" y="24" width="3" height="5"/><circle class="part" cx="0" cy="29" r="3"/><path class="lead" d="M0,0 L-22,-6"/><text class="call" x="-23" y="-5" text-anchor="end">+ knee blade</text><path class="lead" d="M0,29 L22,36"/><text class="call" x="23" y="37" text-anchor="start">+ ankle ball stud</text><text class="name" x="0" y="54" text-anchor="middle">SHIN</text><text class="note" x="0" y="61" text-anchor="middle">&#216;12 &#215; 24 mm</text></g><g transform="translate(495,180)"><path class="part" d="M -20,12 h 48 a 5 5 0 0 0 -1 -8 q -14 -4 -46 -4 a 5 5 0 0 0 -1 12 z"/><path class="void" d="M -2.90129,0 A 3.2,3.2 0 1 0 2.90129,0 Z"/><line class="gnd" x1="-22" y1="12" x2="30" y2="12"/><path class="lead" d="M0,1.35 L-18,-6"/><text class="call" x="-19" y="-5" text-anchor="end">+ ankle socket</text><path class="lead" d="M22,8 L34,2"/><text class="call" x="35" y="3" text-anchor="start">toe &#8212; the balance</text><text class="name" x="4" y="30" text-anchor="middle">FOOT</text><text class="note" x="4" y="37" text-anchor="middle">48 &#215; 24 mm</text></g><g transform="translate(130,184) scale(3.0)" class="det"><g transform="translate(-13,0)"><circle class="part" cx="0" cy="0" r="6"/><circle class="void" cx="0" cy="0" r="3.2"/></g><clipPath id="limbslice"><circle cx="0" cy="0" r="6"/></clipPath><g transform="translate(12,0)"><circle class="ghost" cx="0" cy="0" r="6"/></g><g transform="translate(12,0)" clip-path="url(#limbslice)"><rect class="part" x="-6" y="-3" width="12" height="1.2"/><rect class="part" x="-6" y="1.8" width="12" height="1.2"/><rect class="mate" x="-6" y="-1.5" width="12" height="3"/></g></g><text class="lbl" x="130" y="140" text-anchor="middle">THE JOINTS AGAINST THE LIMB, TO SCALE</text><text class="note" x="130" y="232" text-anchor="middle">Each layer of the fork is a full slice of the limb, so the ends follow the &#216;12 surface.</text><text class="call" x="91" y="214" text-anchor="middle">&#216;12 mm limb, &#216;6.4 mm cavity</text><text class="call" x="91" y="220" text-anchor="middle">leaves 2.8 mm of wall</text><text class="call" x="166" y="214" text-anchor="middle">fork spans 6 mm of a 12 mm limb</text><text class="call" x="166" y="220" text-anchor="middle">ear 1.2, gap 0.3, blade 3</text><g transform="translate(130,330) scale(3.0)" class="det"><path class="mate" d="M -14,1.35 L -3.55211,1.35 A 3.8,3.8 0 1 1 3.55211,1.35 L 14,1.35 L 14,-22 L -14,-22 Z"/><rect class="part" x="-10" y="5" width="20" height="14"/><rect class="part" x="-1.5" y="0" width="3" height="5"/><circle class="part" cx="0" cy="0" r="3"/></g><text class="lbl" x="130" y="248" text-anchor="middle">BALL AND SOCKET, IN SECTION</text><path class="lead" d="M97,279 L80,276"/><text class="call" x="78" y="277" text-anchor="end">socket &#8212; the outboard part</text><path class="lead" d="M122.8,324.3 L80,304"/><text class="call" x="78" y="305" text-anchor="end">cavity &#216;6.4 mm</text><text class="call" x="78" y="312" text-anchor="end">= ball + 2 &#215; fit</text><path class="lead" d="M119.344,334.05 L80,340"/><text class="call" x="78" y="341" text-anchor="end">grip 1.35 mm &#8212; sets the mouth</text><path class="lead" d="M140.656,334.05 L180,310"/><text class="call" x="182" y="311" text-anchor="start">mouth &#216;5.803 mm &#8212; 97% of the ball</text><path class="lead" d="M138.7,331.2 L180,334"/><text class="call" x="182" y="335" text-anchor="start">ball &#216;6 mm</text><path class="lead" d="M134.5,341.4 L180,354"/><text class="call" x="182" y="355" text-anchor="start">stalk &#216;3 mm</text><path class="lead" d="M154,366 L180,376"/><text class="call" x="182" y="377" text-anchor="start">ball stud &#8212; the inboard part</text><text class="note" x="130" y="406" text-anchor="middle">The ball stud goes on the part nearer the torso, the socket on the part further out. Always.</text><text class="note" x="130" y="412" text-anchor="middle">Clearance drawn oversize to be visible; every number here is the real one.</text><g transform="translate(420,330) scale(3.0)" class="det"><g transform="translate(-14,0)"><rect class="part" x="-3" y="-16" width="1.2" height="22"/><rect class="part" x="1.8" y="-16" width="1.2" height="22"/><rect class="mate" x="-1.5" y="-4" width="3" height="24"/><rect class="part" x="-1.8" y="-1" width="0.8" height="2"/><rect class="part" x="1" y="-1" width="0.8" height="2"/><rect class="void" x="-1.5" y="-1.1" width="1" height="2.2"/><rect class="void" x="0.5" y="-1.1" width="1" height="2.2"/></g><g transform="translate(14,0)"><circle class="part" cx="0" cy="0" r="5.80948"/><circle class="hid" cx="0" cy="0" r="4.4"/><circle class="hid" cx="0" cy="0" r="5.2"/><circle class="mate" cx="4.8" cy="0" r="0.4"/><circle class="mate" cx="4.63644" cy="1.24233" r="0.4"/><circle class="mate" cx="4.15692" cy="2.4" r="0.4"/><circle class="mate" cx="3.39411" cy="3.39411" r="0.4"/><circle class="mate" cx="2.4" cy="4.15692" r="0.4"/><circle class="mate" cx="1.24233" cy="4.63644" r="0.4"/><circle class="mate" cx="2.93915e-16" cy="4.8" r="0.4"/><circle class="mate" cx="-1.24233" cy="4.63644" r="0.4"/><circle class="mate" cx="-2.4" cy="4.15692" r="0.4"/><circle class="mate" cx="-3.39411" cy="3.39411" r="0.4"/><circle class="mate" cx="-4.15692" cy="2.4" r="0.4"/><circle class="mate" cx="-4.63644" cy="1.24233" r="0.4"/><circle class="mate" cx="-4.8" cy="5.8783e-16" r="0.4"/><circle class="mate" cx="-4.63644" cy="-1.24233" r="0.4"/><circle class="mate" cx="-4.15692" cy="-2.4" r="0.4"/><circle class="mate" cx="-3.39411" cy="-3.39411" r="0.4"/><circle class="mate" cx="-2.4" cy="-4.15692" r="0.4"/><circle class="mate" cx="-1.24233" cy="-4.63644" r="0.4"/><circle class="mate" cx="-8.81746e-16" cy="-4.8" r="0.4"/><circle class="mate" cx="1.24233" cy="-4.63644" r="0.4"/><circle class="mate" cx="2.4" cy="-4.15692" r="0.4"/><circle class="mate" cx="3.39411" cy="-3.39411" r="0.4"/><circle class="mate" cx="4.15692" cy="-2.4" r="0.4"/><circle class="mate" cx="4.63644" cy="-1.24233" r="0.4"/><circle class="void" cx="0" cy="0" r="1.1"/></g></g><text class="lbl" x="420" y="248" text-anchor="middle">HINGE &#8212; PRESS FIT, WITH DETENTS</text><text class="call" x="378" y="264" text-anchor="middle">ALONG THE LIMB</text><text class="call" x="462" y="264" text-anchor="middle">ONE TOOTHED FACE</text><path class="lead" d="M370.8,291 L366,280"/><text class="call" x="364" y="281" text-anchor="end">clevis &#8212; two ears</text><path class="lead" d="M378,375 L366,376"/><text class="call" x="364" y="377" text-anchor="end">blade &#8212; the tongue between them</text><path class="lead" d="M373.8,330 L366,318"/><text class="call" x="364" y="319" text-anchor="end">stub &#216;2.0 mm on each ear</text><path class="lead" d="M375,334.8 L366,348"/><text class="call" x="364" y="349" text-anchor="end">pocket &#216;2.2 mm in the blade</text><path class="lead" d="M472.17,319.83 L474,304"/><text class="call" x="476" y="305" text-anchor="start">bump &#216;0.8 mm, 15&#176; apart</text><path class="lead" d="M465.3,335.7 L474,338"/><text class="call" x="476" y="339" text-anchor="start">stub bore &#216;2 mm</text><text class="note" x="420" y="404" text-anchor="middle">Elbows and knees. Spread the ears, push the blade in, let go &#8212; the stubs snap into</text><text class="note" x="420" y="410" text-anchor="middle">the pockets and the ears squeeze the toothed faces together, so the joint holds its angle.</text><text class="note" x="420" y="416" text-anchor="middle">No pin. The LEGO bar is only in the gripper now.</text><text class="lbl" x="-60" y="-36" text-anchor="start">SHEET 2 &#8212; THE UNIQUE PARTS</text><text class="note" x="-60" y="-28" text-anchor="start">One of each goes in the Part Studio; the assembly makes the copies.</text><text class="note" x="-60" y="-21" text-anchor="start">A + marks a joint part: modeled on its own, then added to the part it sits on. A socket is added too, even though it cuts material away.</text><text class="note" x="-60" y="442" text-anchor="start">Every ball stud stands off its face on a stalk, as drawn here. On sheet 1 the joint centers sit on their station lines instead &#8212; that is the kinematic view.</text><text class="note" x="-60" y="449" text-anchor="start">Where the two sheets disagree, this one is the one to build from.</text><text class="warn" x="-60" y="460" text-anchor="start">Unresolved: the hip station sits on the torso&#8217;s own bottom face, so the hip stud has nowhere to stand. Either the stud gets a stand-off and the leg drops with it,</text><text class="warn" x="-60" y="467" text-anchor="start">or the torso gets a recess at each hip. Decide before the legs are modeled.</text></svg>