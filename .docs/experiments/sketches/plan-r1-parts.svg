<svg xmlns="http://www.w3.org/2000/svg" viewBox="-70 -48 650 535" width="2210" height="1819" font-family="ui-monospace, Menlo, monospace"><style>
  .part  { fill:#dfe7ec; stroke:#1d262e; stroke-width:0.9; stroke-linejoin:round; }
