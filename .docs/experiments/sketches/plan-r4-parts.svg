</style><g transform="translate(60,60)"><g class="fig" transform="scale(0.501427)"><clipPath id="shp0"><rect x="-400" y="-48" width="800" height="800"/></clipPath><g clip-path="url(#shp0)"><path class="part" d="M -36.000,-54.638 L -51.039,-31.594 L -37.639,-22.850 L -36.000,-25.362 Z"/><rect class="part" x="-3" y="0" width="6" height="9.53653" transform="translate(-44.3390,-27.2218) rotate(33.1283)"/></g><clipPath id="shp1"><rect x="-400" y="-48" width="800" height="800"/></clipPath><g clip-path="url(#shp1)"><path class="part" d="M 36.000,-54.638 L 51.039,-31.594 L 37.639,-22.850 L 36.000,-25.362 Z"/><rect class="part" x="-3" y="0" width="6" height="9.53653" transform="translate(44.3390,-27.2218) rotate(-33.1283)"/></g><rect class="part" x="-36" y="-48" width="72" height="96"/><circle class="part" cx="-49.5509" cy="-19.2355" r="6"/><circle class="part" cx="49.5509" cy="-19.2355" r="6"/><rect class="part" x="-3" y="-58" width="6" height="10"/><circle class="part" cx="0" cy="-58" r="6"/><rect class="part" x="-15" y="48" width="6" height="10"/><circle class="part" cx="-12" cy="58" r="6"/><rect class="part" x="9" y="48" width="6" height="10"/><circle class="part" cx="12" cy="58" r="6"/><line class="ctr" x1="0" y1="-62" x2="0" y2="62"/><path class="lead" d="M-2.6,-59.5 L-14,-61"/><text class="call" x="-29.9146" y="-71.9317" text-anchor="end">+ neck ball stud</text><path class="lead" d="M52.5509,-19.2355 L52,-44"/><text class="call" x="53.9943" y="-42.0057" text-anchor="start">+ shoulder ball stud</text><text class="call" x="53.9943" y="-32.8319" text-anchor="start">53&#176; down, 30&#176; forward</text><path class="lead" d="M39,-45 L52,-25"/><text class="call" x="53.9943" y="-23.0057" text-anchor="start">&#216;16 boss on the same axis,</text><text class="call" x="53.9943" y="-13.8319" text-anchor="start">cut flush at the top face</text><path class="lead" d="M12,61 L12,61 L26,61"/><text class="call" x="53.8463" y="75.9203" text-anchor="start">+ hip ball stud</text><text class="name" x="0" y="95.8634" text-anchor="middle">TORSO</text><text class="note" x="0" y="109.824" text-anchor="middle">72 &#215; 96 &#215; 48 mm</text></g></g><g transform="translate(185,52)"><g class="fig" transform="scale(0.501427)"><rect class="part" x="-36" y="-36" width="72" height="72"/><circle class="part" cx="-16" cy="-16" r="10"/><circle class="part" cx="16" cy="-16" r="10"/><circle class="part" cx="-16" cy="-16" r="4"/><circle class="part" cx="16" cy="-16" r="4"/><rect class="part" x="-20" y="13" width="40" height="10" rx="5"/><rect class="part" x="-9" y="36" width="18" height="11"/><path class="void" d="M -5.76888,47 A 6.8,6.8 0 1 1 5.76888,47 Z"/><path class="hid" d="M -0.8,36 V 47 M 0.8,36 V 47"/><path class="lead" d="M9,41.5 L16,40"/><text class="call" x="33.9033" y="45.9715" text-anchor="start">+ neck socket, collar &#216;18</text><text class="call" x="33.9033" y="55.9431" text-anchor="start">11 mm proud, four 1.6 slits</text><path class="lead" d="M16,-16 L39.8862,-39.8862"/><text class="call" x="41.8805" y="-39.8862" text-anchor="start">eye and pupil</text><path class="lead" d="M10,18 L39.8862,31.9089"/><text class="call" x="41.8805" y="33.9033" text-anchor="start">mouth &#8212; slot</text><text class="name" x="0" y="70.9317" text-anchor="middle">HEAD</text><text class="note" x="0" y="84.8919" text-anchor="middle">72 &#215; 72 &#215; 60 mm</text></g></g><g transform="translate(310,22)"><g class="fig" transform="scale(0.501427)"><rect class="part" x="-12" y="0" width="24" height="48"/><path class="void" d="M -12,-0.768882 A 6.8,6.8 0 1 0 -12,10.7689 Z"/><path class="part" d="M -12,42 L -12,48 A 12,12 0 0 0 12,48 L 12,42 Z"/><circle class="hid" cx="0" cy="48" r="2"/><path class="hid" d="M -5.6,27.000 V 58.613 M 5.6,27.000 V 58.613 M -5.6,27.000 H 5.6"/><path class="lead" d="M-11,5 L-30,2"/><text class="call" x="-49.8919" y="5.98293" text-anchor="end">+ shoulder socket</text><path class="lead" d="M0,48 L28,56"/><text class="call" x="29" y="57" text-anchor="start">+ elbow clevis</text><text class="name" x="0" y="107.829" text-anchor="middle">UPPER ARM</text><text class="note" x="0" y="121.789" text-anchor="middle">&#216;24 &#215; 48 mm</text></g></g><g transform="translate(400,22)"><g class="fig" transform="scale(0.501427)"><rect class="part" x="-12" y="0" width="24" height="48"/><path class="part" d="M -12,6 L -12,0 A 12,12 0 0 1 12,0 L 12,6 Z"/><circle class="void" cx="0" cy="0" r="2.1"/><path class="hid" d="M -0.8,20 V -11.973 M 0.8,20 V -11.973"/><path class="hid" d="M -12,20 H 12"/><rect class="part" x="-3" y="48" width="6" height="10"/><circle class="part" cx="0" cy="58" r="6"/><path class="lead" d="M0,0 L-28,-6"/><text class="call" x="-45.9033" y="-9.97155" text-anchor="end">+ elbow blade</text><path class="lead" d="M0,58 L28,60"/><text class="call" x="29" y="61" text-anchor="start">+ wrist ball stud</text><text class="name" x="0" y="107.829" text-anchor="middle">FOREARM</text><text class="note" x="0" y="121.789" text-anchor="middle">&#216;24 &#215; 48 mm</text></g></g><g transform="translate(490,30)"><g class="fig" transform="scale(0.501427)"><rect class="part" x="-3" y="0" width="6" height="19"/><path class="part" d="M -3.214,22.830 A 5.0,5.0 0 1 1 3.214,22.830 L 1.028,20.226 A 1.6,1.6 0 1 0 -1.028,20.226 Z"/><path class="void" d="M -5.76888,0 A 6.8,6.8 0 1 0 5.76888,0 Z"/><path class="lead" d="M0,3.6 L-31.9089,-11.9659"/><text class="call" x="-33.9033" y="-9.97155" text-anchor="end">+ wrist socket</text><path class="lead" d="M4,17 L18,4"/><text class="call" x="37.8919" y="9.97155" text-anchor="start">clip &#8212; grips &#216;3.2 mm bar</text><path class="lead" d="M0,24 L35.8976,43.8748"/><text class="call" x="37.8919" y="45.8691" text-anchor="start">mouth on the centerline</text><text class="name" x="0" y="91.7382" text-anchor="middle">GRIPPER</text><text class="note" x="0" y="105.698" text-anchor="middle">24 mm below the wrist</text></g></g><g transform="translate(310,160)"><g class="fig" transform="scale(0.501427)"><rect class="part" x="-12" y="0" width="24" height="48"/><path class="void" d="M -5.76888,0 A 6.8,6.8 0 1 0 5.76888,0 Z"/><path class="part" d="M -12,42 L -12,48 A 12,12 0 0 0 12,48 L 12,42 Z"/><circle class="hid" cx="0" cy="48" r="2"/><path class="hid" d="M -5.6,27.000 V 58.613 M 5.6,27.000 V 58.613 M -5.6,27.000 H 5.6"/><path class="lead" d="M0,3.6 L-28,-4"/><text class="call" x="-45.9033" y="-5.98293" text-anchor="end">+ hip socket</text><path class="lead" d="M0,48 L28,56"/><text class="call" x="29" y="57" text-anchor="start">+ knee clevis</text><text class="name" x="0" y="107.829" text-anchor="middle">THIGH</text><text class="note" x="0" y="121.789" text-anchor="middle">&#216;24 &#215; 48 mm</text></g></g><g transform="translate(400,160)"><g class="fig" transform="scale(0.501427)"><rect class="part" x="-12" y="0" width="24" height="48"/><path class="part" d="M -12,6 L -12,0 A 12,12 0 0 1 12,0 L 12,6 Z"/><circle class="void" cx="0" cy="0" r="2.1"/><path class="hid" d="M -0.8,20 V -11.973 M 0.8,20 V -11.973"/><path class="hid" d="M -12,20 H 12"/><rect class="part" x="-3" y="48" width="6" height="10"/><circle class="part" cx="0" cy="58" r="6"/><path class="lead" d="M0,0 L-28,-6"/><text class="call" x="-45.9033" y="-9.97155" text-anchor="end">+ knee blade</text><path class="lead" d="M0,58 L28,60"/><text class="call" x="29" y="61" text-anchor="start">+ ankle ball stud</text><text class="name" x="0" y="107.829" text-anchor="middle">SHIN</text><text class="note" x="0" y="121.789" text-anchor="middle">&#216;24 &#215; 48 mm</text></g></g><g transform="translate(495,180)"><g class="fig" transform="scale(0.501427)"><path class="part" d="M -40,24 h 96 a 10 10 0 0 0 -2 -16 q -28 -8 -92 -8 a 10 10 0 0 0 -2 24 z"/><path class="void" d="M -5.76888,0 A 6.8,6.8 0 1 0 5.76888,0 Z"/><line class="gnd" x1="-44" y1="24" x2="60" y2="24"/><path class="lead" d="M0,3.6 L-35.8976,-11.9659"/><text class="call" x="-37.8919" y="-9.97155" text-anchor="end">+ ankle socket</text><path class="lead" d="M44,16 L67.8065,3.98862"/><text class="call" x="69.8008" y="5.98293" text-anchor="start">toe &#8212; the balance</text><text class="name" x="8" y="59.8293" text-anchor="middle">FOOT</text><text class="note" x="8" y="73.7894" text-anchor="middle">96 &#215; 48 mm</text></g></g><g transform="translate(130,184) scale(1.5042802790107803)" class="det"><g transform="translate(-25.926,0)"><circle class="part" cx="0" cy="0" r="12"/><circle class="void" cx="0" cy="0" r="6.8"/></g><clipPath id="limbslice"><circle cx="0" cy="0" r="12"/></clipPath><g transform="translate(23.9317,0)"><circle class="ghost" cx="0" cy="0" r="12"/></g><g transform="translate(23.9317,0)" clip-path="url(#limbslice)"><rect class="part" x="-12" y="-12" width="24" height="6.4"/><rect class="part" x="-12" y="5.6" width="24" height="6.4"/><rect class="mate" x="-12" y="-5" width="24" height="10"/><rect class="void" x="-12" y="-0.8" width="24" height="1.6"/></g></g><text class="lbl" x="130" y="140" text-anchor="middle">THE JOINTS AGAINST THE LIMB, TO SCALE</text><text class="note" x="130" y="232" text-anchor="middle">The fork is the whole limb with a slot through it, and the blade is what the slot took out.</text><text class="note" x="130" y="238" text-anchor="middle">Four walls, all of them springs: two ears, and the two halves the slit leaves of the blade.</text><text class="call" x="91" y="214" text-anchor="middle">&#216;24 mm limb, &#216;13.6 mm cavity</text><text class="call" x="91" y="220" text-anchor="middle">leaves 5.2 mm of wall</text><text class="call" x="166" y="214" text-anchor="middle">slot 11.2 mm through a 24 mm limb</text><text class="call" x="166" y="220" text-anchor="middle">ear 6.4, tab 4.2, either side of a 1.6 slit</text><g transform="translate(130,330) scale(1.5042802790107803)" class="det"><path class="mate" d="M -27.9203,3.6 L -6.68811,3.6 A 7.59545,7.59545 0 1 1 6.68811,3.6 L 27.9203,3.6 L 27.9203,-43.8748 L -27.9203,-43.8748 Z"/><rect class="part" x="-19.9431" y="10" width="39.8862" height="27.9203"/><rect class="part" x="-3" y="0" width="6" height="10"/><circle class="part" cx="0" cy="0" r="6"/></g><text class="lbl" x="130" y="248" text-anchor="middle">BALL AND SOCKET, IN SECTION</text><path class="lead" d="M97,279 L80,276"/><text class="call" x="78" y="277" text-anchor="end">socket &#8212; the outboard part</text><path class="lead" d="M122.8,324.3 L80,304"/><text class="call" x="78" y="305" text-anchor="end">cavity &#216;13.6 mm</text><text class="call" x="78" y="312" text-anchor="end">= ball + 2 &#215; fit</text><path class="lead" d="M119.939,335.415 L80,340"/><text class="call" x="78" y="341" text-anchor="end">grip 3.6 mm &#8212; sets the mouth</text><path class="lead" d="M140.061,335.415 L180,310"/><text class="call" x="182" y="311" text-anchor="start">mouth &#216;11.54 mm &#8212; 96% of the ball</text><path class="lead" d="M138.7,331.2 L180,334"/><text class="call" x="182" y="335" text-anchor="start">ball &#216;12 mm</text><path class="lead" d="M134.5,341.4 L180,354"/><text class="call" x="182" y="355" text-anchor="start">stalk &#216;6 mm</text><path class="lead" d="M154,366 L180,376"/><text class="call" x="182" y="377" text-anchor="start">ball stud &#8212; the inboard part</text><text class="note" x="130" y="406" text-anchor="middle">The ball stud goes on the part nearer the torso, the socket on the part further out. Always.</text><text class="note" x="130" y="412" text-anchor="middle">Clearance drawn oversize to be visible; every number here is the real one.</text><g transform="translate(420,330) scale(1.5042802790107803)" class="det"><g transform="translate(-21.9374,0)"><path class="part" d="M -5.600,-33 L -12.000,-33 L -12.000,0 A 12,12 0 0 0 -5.600,10.613 Z"/><path class="part" d="M 5.600,-33 L 12.000,-33 L 12.000,0 A 12,12 0 0 1 5.600,10.613 Z"/><path class="mate" d="M -5,20 L -5,-10.909 A 12,12 0 0 1 5,-10.909 L 5,20 Z"/><rect class="void" x="-0.8" y="-12" width="1.6" height="32"/><rect class="part" x="-5.6" y="-2" width="1.6" height="4"/><rect class="part" x="4" y="-2" width="1.6" height="4"/><rect class="void" x="-5" y="-2.19943" width="2" height="4.39886"/><rect class="void" x="3" y="-2.19943" width="2" height="4.39886"/></g><g transform="translate(27.9203,0)"><circle class="part" cx="0" cy="0" r="10.9087"/><circle class="hid" cx="0" cy="0" r="8.8"/><circle class="hid" cx="0" cy="0" r="10.4"/><circle class="mate" cx="9.6" cy="0" r="0.8"/><circle class="mate" cx="9.27289" cy="2.48466" r="0.8"/><circle class="mate" cx="8.31384" cy="4.8" r="0.8"/><circle class="mate" cx="6.78823" cy="6.78823" r="0.8"/><circle class="mate" cx="4.8" cy="8.31384" r="0.8"/><circle class="mate" cx="2.48466" cy="9.27289" r="0.8"/><circle class="mate" cx="5.8783e-16" cy="9.6" r="0.8"/><circle class="mate" cx="-2.48466" cy="9.27289" r="0.8"/><circle class="mate" cx="-4.8" cy="8.31384" r="0.8"/><circle class="mate" cx="-6.78823" cy="6.78823" r="0.8"/><circle class="mate" cx="-8.31384" cy="4.8" r="0.8"/><circle class="mate" cx="-9.27289" cy="2.48466" r="0.8"/><circle class="mate" cx="-9.6" cy="1.17566e-15" r="0.8"/><circle class="mate" cx="-9.27289" cy="-2.48466" r="0.8"/><circle class="mate" cx="-8.31384" cy="-4.8" r="0.8"/><circle class="mate" cx="-6.78823" cy="-6.78823" r="0.8"/><circle class="mate" cx="-4.8" cy="-8.31384" r="0.8"/><circle class="mate" cx="-2.48466" cy="-9.27289" r="0.8"/><circle class="mate" cx="-1.76349e-15" cy="-9.6" r="0.8"/><circle class="mate" cx="2.48466" cy="-9.27289" r="0.8"/><circle class="mate" cx="4.8" cy="-8.31384" r="0.8"/><circle class="mate" cx="6.78823" cy="-6.78823" r="0.8"/><circle class="mate" cx="8.31384" cy="-4.8" r="0.8"/><circle class="mate" cx="9.27289" cy="-2.48466" r="0.8"/><circle class="void" cx="0" cy="0" r="2.19943"/><rect class="void" x="-0.8" y="-10.9087" width="1.6" height="21.8174"/></g></g><text class="lbl" x="420" y="248" text-anchor="middle">HINGE &#8212; PRESS FIT, WITH DETENTS</text><text class="call" x="387" y="264" text-anchor="middle">ALONG THE LIMB</text><text class="call" x="462" y="264" text-anchor="middle">ONE TOOTHED FACE</text><path class="lead" d="M373.762,291 L354,286"/><text class="call" x="352" y="287" text-anchor="end">clevis &#8212; two ears</text><path class="lead" d="M379.779,330 L354,306"/><text class="call" x="352" y="307" text-anchor="end">stub &#216;4.0 mm on each ear</text><path class="lead" d="M380.983,334.8 L354,326"/><text class="call" x="352" y="327" text-anchor="end">pocket &#216;4.2 mm in the blade</text><path class="lead" d="M387,345 L354,346"/><text class="call" x="352" y="347" text-anchor="end">slit 1.6 mm, the blade&#8217;s whole 32 mm</text><path class="lead" d="M390.761,357.086 L354,366"/><text class="call" x="352" y="367" text-anchor="end">blade &#8212; the tongue between them</text><path class="lead" d="M472.17,319.83 L474,304"/><text class="call" x="476" y="305" text-anchor="start">bump &#216;1.6 mm, 15&#176; apart</text><path class="lead" d="M465.3,335.7 L474,338"/><text class="call" x="476" y="339" text-anchor="start">stub bore &#216;4 mm</text><text class="note" x="420" y="404" text-anchor="middle">Elbows and knees. Push the blade in &#8212; the ears spread, the slit closes, and the stubs snap</text><text class="note" x="420" y="410" text-anchor="middle">into the pockets. The ears then squeeze the toothed faces together, so the joint holds its angle.</text><text class="note" x="420" y="416" text-anchor="middle">Ear and blade are springs in series, matched so both give: 0.37 and 0.63 mm of the 1.0, at 19.2 and 20.01 MPa</text><text class="note" x="420" y="422" text-anchor="middle">against PETG&#8217;s 50, and about 13.6 kgf to press together. No pin &#8212; the LEGO bar is only in the gripper.</text><text class="lbl" x="-60" y="-36" text-anchor="start">SHEET 2 &#8212; THE UNIQUE PARTS</text><text class="note" x="-60" y="-28" text-anchor="start">One of each goes in the Part Studio; the assembly makes the copies.</text><text class="note" x="-60" y="-21" text-anchor="start">A + marks a joint part: modeled on its own, then added to the part it sits on. A socket is added too, even though it cuts material away.</text><text class="note" x="-60" y="442" text-anchor="start">Every ball stud stands off its face on a stalk, as drawn here. On sheet 1 the joint centers sit on their station lines instead &#8212; that is the kinematic view.</text><text class="note" x="-60" y="449" text-anchor="start">Where the two sheets disagree, this one is the one to build from.</text><text class="note" x="-60" y="460" text-anchor="start">The hip stud stands off the torso&#8217;s bottom face like every other, and the leg drops the 10 mm with it. A recess into the torso was considered and dropped: it buys no swing, because the 31.86&#176; limit is set inside the socket, by the stalk meeting the mouth.</text><text class="note" x="-60" y="471" text-anchor="start">The shoulder is the exception. Its stud runs 26 mm from the side face, of which only the last 10 is &#216;6; the rest is a &#216;16 boss on the same axis, cut off flush where it crosses the top face. Coaxial is what makes the boss free: it sits behind the ball, and the socket only reaches forward of it.</text><text class="note" x="-60" y="482" text-anchor="start">The hinge divides the same &#216;24 four ways: ear 6.4, tab 4.2, tab 4.2, ear 6.4, with two 0.6 clearances and a 1.6 slit between them. Ear and tab are springs in series, so the stiffer of the two does nothing unless they are</text><text class="note" x="-60" y="493" text-anchor="start">matched. Matched on section modulus over free length, they share the 1.0 the stub needs &#8212; 0.37 in the ears, 0.63 in the blade &#8212; and reach 19.2 and 20.01 MPa together. A joint is only as strong as where the load crosses it.</text></svg>