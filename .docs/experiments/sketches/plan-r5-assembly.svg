><line class="stn" x1="-58" y1="89.8288" x2="58" y2="89.8288"/><text class="call" x="-60" y="91.0288" text-anchor="end">hip 120 mm</text><line class="stn" x1="-58" y1="51.1009" x2="58" y2="51.1009"/><text class="call" x="-60" y="52.3009" text-anchor="end">shoulder 197.24 mm</text><line class="stn" x1="-58" y1="31.6633" x2="58" y2="31.6633"/><text class="call" x="-60" y="32.8633" text-anchor="end">neck 236 mm</text><line class="stn" x1="-58" y1="9.90136" x2="58" y2="9.90136"/><text class="call" x="-60" y="11.1014" text-anchor="end">head center 279.4 mm</text><g class="dim"><path d="M -70 -8.15 H -78 M -70 150 H -78"/><path d="M -75 -8.15 V 150"/><path d="M -75 -8.15 l -1.4 4 h 2.8 z" fill="#b8156e"/><path d="M -75 150 l -1.4 -4 h 2.8 z" fill="#b8156e"/></g><text class="dimt" x="-79" y="70.925" text-anchor="middle" transform="rotate(-90 -79 70.925)">315.4 mm</text><path class="lead" d="M0,3.90136 L62,-6.15"/><text class="call" x="64" y="-4.95" text-anchor="start">head</text><path class="lead" d="M0,31.6633 L62,31.6633"/><text class="call" x="64" y="32.8633" text-anchor="start">neck ball joint</text><path class="lead" d="M7,44.6776 L62,40.6776"/><text class="call" x="64" y="41.8776" text-anchor="start">torso</text><path class="lead" d="M27.8461,60.1009 L62,57.1009"/><text class="call" x="64" y="58.3009" text-anchor="start">upper arm</text><path class="lead" d="M2.4,60.746 L62,63.6009"/><text class="call" x="64" y="64.8009" text-anchor="start">origin &#8212; center of the torso</text><path class="lead" d="M39.9999,81.257 L62,81.257"/><text class="call" x="64" y="82.457" text-anchor="start">forearm</text><path class="lead" d="M37.0486,101.811 L62,98.8106"/><text class="call" x="64" y="100.011" text-anchor="start">gripper</text><path class="lead" d="M18.0514,109.829 L62,109.829"/><text class="call" x="64" y="111.029" text-anchor="start">thigh</text><path class="lead" d="M12.0342,125.897 L62,125.897"/><text class="call" x="64" y="127.097" text-anchor="start">shin</text><path class="lead" d="M10,143.966 L62,141.966"/><text class="call" x="64" y="143.166" text-anchor="start">foot</text></g><g transform="translate(196,0)"><g class="fig" transform="scale(0.501427)"><rect class="part" x="-24" y="73.1464" width="48" height="96"/><rect class="part" x="-3" y="61.1464" width="6" height="12"/><circle class="part" cx="0" cy="63.1464" r="6"/><rect class="part" x="-9" y="55.7464" width="18" height="11"/><rect class="part" x="-30" y="-16.2536" width="60" height="72"/><rect class="part" x="-12" y="179.146" width="24" height="48"/><rect class="part" x="-12" y="227.146" width="24" height="48"/><path class="part" d="M -40,299.146 h 96 a 10 10 0 0 0 -2 -16 q -28 -8 -92 -8 a 10 10 0 0 0 -2 24 z"/><rect class="part" x="-4.1764" y="169.146" width="24" height="43.422"/><rect class="hid" x="-4.1764" y="101.911" width="24" height="67.2355"/><line class="ctr" x1="0" y1="-22.2536" x2="0" y2="305.146"/></g><line class="gnd" x1="-26" y1="150" x2="34" y2="150"/><g class="dim"><path d="M -12 84.8145 V 89.8145 M 12 84.8145 V 89.8145"/><path d="M -12 88.3145 H 12"/><path d="M -12 88.3145 l 4 -1.4 v 2.8 z" fill="#b8156e"/><path d="M 12 88.3145 l -4 -1.4 v 2.8 z" fill="#b8156e"/></g><text class="dimt" x="-14" y="87.3145" text-anchor="end">48 mm</text><path class="lead" d="M3.92296,98.5875 L26,102.587"/><text class="call" x="27" y="103.587" text-anchor="start">both arms, edge-on</text><text class="note" x="4" y="168" text-anchor="middle">The arms lie in one plane 7.82 mm forward of center,</text><text class="note" x="4" y="174" text-anchor="middle">so this view sees them edge-on and both at once. Dashed</text><text class="note" x="4" y="180" text-anchor="middle">where the torso is in front of them.</text></g><text class="lbl" x="0" y="-10" text-anchor="middle">FRONT</text><text class="lbl" x="196" y="-10" text-anchor="middle">SIDE</text><text class="lbl" x="-86" y="-52" text-anchor="start">SHEET 1 &#8212; ASSEMBLED</text><text class="note" x="-86" y="-44" text-anchor="start">The parts from sheet 2, assembled. Joint centers sit on their station lines, and every station is derived &#8212; nothing is fitted to a round height.</text><text class="note" x="-86" y="-38" text-anchor="start">Shoulder stud 53&#176; down and 30&#176; forward, 26 mm long: a &#216;16 boss coaxial with the last 10 mm of &#216;6 stalk, cut flush at the torso's top face.</text><text class="note" x="-86" y="-32" text-anchor="start">That puts the ball 13.55 mm clear of the side, so a &#216;24 arm swings anywhere the socket allows &#8212; 6.09&#176; to 60.17&#176; from vertical.</text><text class="note" x="-86" y="-26" text-anchor="start">The arm is drawn at 33.13&#176;, hanging 17.51&#176; off the stud. All of that is fore-and-aft, so it stays in one plane and this view reads true length.</text><text class="note" x="-86" y="-20" text-anchor="start">Elbows bent 45&#176;; the gripper's bore runs fore-and-aft, so its hole stays a full circle.</text><text class="note" x="-86" y="198" text-anchor="start">Session 1 builds the neck as a plain &#216;24 mm post. It becomes the ball joint shown here once joints are taught.</text></svg>