[project]
name = "cad-class"
version = "0.1.0"
description = "A four-session Onshape CAD course: the text, and the tooling that checks it"
requires-python = ">=3.12"
dependencies = [
    "playwright>=1.44",
    "pillow>=10.3",
    "sphinx>=7.3",
    "sphinx-rtd-theme>=2.0",
    "numpy>=2.5.2",
]

[dependency-groups]
dev = [
    "codespell>=2.3",
    "textstat>=0.7",
]

[tool.uv]
package = false
